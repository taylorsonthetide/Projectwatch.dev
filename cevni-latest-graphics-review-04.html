<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEVNI Latest Graphics Approval Batch 04</title><style>
body{margin:0;background:#07151c;color:#eef9fc;font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b2632;padding:16px;border-bottom:1px solid #28505e}h1{font-size:22px;margin:0}.sub{color:#b8d5de;margin:5px 0 10px}.bar{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:9px 11px;font-weight:800}.bar button{background:#183b48;color:#fff}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;padding:16px}.card{background:#0e222b;border:2px solid #244854;border-radius:14px;overflow:hidden}.card[data-status=approved]{border-color:#4ac78a}.card[data-status=rejected]{border-color:#e96c6c}.card[data-status=hold]{border-color:#e8bd59}.art{height:290px;background:#fff;display:grid;place-items:center}.art svg{width:100%;height:100%}.body{padding:13px}.code{font-size:23px;color:#79e0ff;font-weight:900}h3{font-size:16px;margin:4px 0 7px}p,small{color:#b8d5de}.buttons{display:flex;gap:6px;margin-top:11px}.approve{background:#4ac78a}.reject{background:#e96c6c}.hold{background:#e8bd59}textarea{box-sizing:border-box;width:100%;min-height:50px;margin-top:9px;background:#07151c;color:#fff;border:1px solid #315b68;border-radius:8px;padding:8px}.hidden{display:none}#results{display:none;margin:16px;background:#fff;color:#111;padding:12px;border-radius:10px;white-space:pre-wrap}</style></head><body>
<header><h1>PROJECT WATCH · CEVNI LATEST GRAPHICS · APPROVAL BATCH 04</h1><div class="sub">Lakes & broad waterways · Cardinal / isolated danger / new danger · Rev.6 Annex 8 figs.22–23 bis · legacy v5 excluded</div><div class="bar"><button onclick="filter('all')">ALL 8</button><button onclick="filter('unreviewed')">UNREVIEWED</button><button onclick="filter('approved')">APPROVED</button><button onclick="filter('rejected')">REJECTED</button><button onclick="filter('hold')">HOLD</button><button onclick="showResults()">SHOW / COPY RESULTS</button></div></header><main id="cards"></main><pre id="results"></pre>
<script>
const items=[['N-CARDINAL','North cardinal mark','N','Black above yellow; two cones points upward'],['E-CARDINAL','East cardinal mark','E','Black-yellow-black; cones base to base'],['S-CARDINAL','South cardinal mark','S','Yellow above black; two cones points downward'],['W-CARDINAL','West cardinal mark','W','Yellow-black-yellow; cones point to point'],['8.D','Isolated danger — pillar','D','Black with broad red band(s); two black spheres'],['8.D1','Isolated danger — spar','D1','Black with broad red band(s); two black spheres'],['8.G','New danger — pillar','G','Equal blue/yellow vertical stripes; yellow cross topmark'],['8.G1','New danger — spar','G1','Equal blue/yellow vertical stripes; yellow cross topmark']];
const KEY='pwCevniLatestGraphicsBatch04';let db=JSON.parse(localStorage.getItem(KEY)||'{}');
function cone(x,y,dir){return dir==='up'?'<polygon points="'+x+','+(y-24)+' '+(x-25)+','+(y+18)+' '+(x+25)+','+(y+18)+'" fill="#111"/>':'<polygon points="'+(x-25)+','+(y-18)+' '+(x+25)+','+(y-18)+' '+x+','+(y+24)+'" fill="#111"/>'}
function cardinal(t){let bands={N:['#111','#ffd21c'],E:['#111','#ffd21c','#111'],S:['#ffd21c','#111'],W:['#ffd21c','#111','#ffd21c']}[t], y=118,h=125/bands.length,s='';bands.forEach((c,i)=>s+='<rect x="137" y="'+(y+i*h)+'" width="46" height="'+(h+1)+'" fill="'+c+'"/>');let tops=t==='N'?cone(160,45,'up')+cone(160,88,'up'):t==='S'?cone(160,45,'down')+cone(160,88,'down'):t==='E'?cone(160,48,'down')+cone(160,83,'up'):cone(160,48,'up')+cone(160,83,'down');return '<svg viewBox="0 0 320 290">'+tops+'<rect x="137" y="118" width="46" height="125" fill="none" stroke="#111" stroke-width="3"/>'+s+'<path d="M100 250h120" stroke="#387ba0" stroke-width="3"/></svg>'}
function svg(t){if('NESW'.includes(t))return cardinal(t);if(t==='D'||t==='D1'){let body=t==='D'?'<path d="M135 118h50l15 120h-80z" fill="#111" stroke="#111" stroke-width="3"/><rect x="123" y="163" width="74" height="32" fill="#e30613"/>':'<rect x="145" y="115" width="30" height="128" fill="#111"/><rect x="145" y="158" width="30" height="36" fill="#e30613"/>';return '<svg viewBox="0 0 320 290"><circle cx="160" cy="48" r="20" fill="#111"/><circle cx="160" cy="91" r="20" fill="#111"/>'+body+'<path d="M100 250h120" stroke="#387ba0" stroke-width="3"/></svg>'}let pillar=t==='G';let body=pillar?'<path d="M125 112h70l15 130h-100z" fill="#ffd21c" stroke="#111" stroke-width="3"/><path d="M142 114l-10 126h24l5-126zm38 0 9 126h-24l-4-126z" fill="#1265c4"/>':'<rect x="140" y="112" width="40" height="130" fill="#ffd21c" stroke="#111" stroke-width="3"/><rect x="150" y="113" width="10" height="128" fill="#1265c4"/><rect x="170" y="113" width="9" height="128" fill="#1265c4"/>';return '<svg viewBox="0 0 320 290"><path d="M160 38v58M130 67h60" stroke="#ffd21c" stroke-width="13"/>'+body+'<path d="M100 250h120" stroke="#387ba0" stroke-width="3"/></svg>'}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){cards.innerHTML=items.map(x=>{let id='PW-CEVNI-ANNEX8-'+x[0].replace('.','-'),r=db[id]||{status:'unreviewed',note:''};return '<article class="card" data-id="'+id+'" data-status="'+r.status+'"><div class="art">'+svg(x[2])+'</div><div class="body"><div class="code">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[3]+'</p><small>'+id+' · CLEAN REV.6 RECONSTRUCTION · HUMAN APPROVAL REQUIRED</small><div class="buttons"><button class="approve" onclick="setState(this,\'approved\')">✓ APPROVE</button><button class="reject" onclick="setState(this,\'rejected\')">✕ REJECT</button><button class="hold" onclick="setState(this,\'hold\')">? HOLD</button></div><textarea placeholder="Optional note" oninput="saveNote(this)">'+esc(r.note)+'</textarea></div></article>'}).join('')}
function setState(b,s){let c=b.closest('.card'),id=c.dataset.id;c.dataset.status=s;db[id]={status:s,note:c.querySelector('textarea').value};localStorage.setItem(KEY,JSON.stringify(db))}
function saveNote(t){let c=t.closest('.card'),id=c.dataset.id;db[id]=db[id]||{status:c.dataset.status};db[id].note=t.value;localStorage.setItem(KEY,JSON.stringify(db))}
function filter(s){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',s!=='all'&&c.dataset.status!==s))}
async function showResults(){let out={version:'latest-graphics-batch-04',authority:'CEVNI Rev.6 Annex 8 figs.22-23 bis; Corr.1/Corr.2 and Amendments 1/2 checked before promotion',old_v5_artwork:'EXCLUDED',review:db},txt=JSON.stringify(out,null,2),p=document.getElementById('results');p.textContent=txt;p.style.display='block';p.scrollIntoView({behavior:'smooth'});try{await navigator.clipboard.writeText(txt);alert('Results copied. Paste them back into ChatGPT.')}catch(e){alert('Results shown below. Select and copy them into ChatGPT.')}}
render();</script></body></html>
