name: Boating weather compiled-engine validation
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weather-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare Rust browser target
        run: rustup target add wasm32-unknown-unknown
      - name: Compile C++ comfort and Rust interpolation modules
        run: bash native/build.sh
      - name: Check personal limits, 72-hour coverage, missing data and offline isolation
        run: node --test native/tests/weather.test.mjs
