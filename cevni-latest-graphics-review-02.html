<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEVNI Latest Graphics Approval Batch 02</title>
<style>body{margin:0;background:#07151c;color:#eef9fc;font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b2632;padding:16px;border-bottom:1px solid #28505e}h1{font-size:22px;margin:0}.sub{color:#b8d5de;margin:5px 0 10px}.bar{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:9px 11px;font-weight:800}.bar button{background:#183b48;color:#fff}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:16px}.card{background:#0e222b;border:2px solid #244854;border-radius:14px;overflow:hidden}.card[data-status=approved]{border-color:#4ac78a}.card[data-status=rejected]{border-color:#e96c6c}.card[data-status=hold]{border-color:#e8bd59}.art{height:300px;background:white;display:grid;place-items:center}.art svg{width:100%;height:100%}.body{padding:13px}.code{font-size:23px;color:#79e0ff;font-weight:900}h3{font-size:16px;margin:4px 0 7px}p,small{color:#b8d5de}.buttons{display:flex;gap:6px;margin-top:11px}.approve{background:#4ac78a}.reject{background:#e96c6c}.hold{background:#e8bd59}textarea{box-sizing:border-box;width:100%;min-height:50px;margin-top:9px;background:#07151c;color:white;border:1px solid #315b68;border-radius:8px;padding:8px}.hidden{display:none}#results{display:none;margin:16px;background:#fff;color:#111;padding:12px;border-radius:10px;white-space:pre-wrap}</style></head><body>
<header><h1>PROJECT WATCH · CEVNI LATEST GRAPHICS · APPROVAL BATCH 02</h1><div class="sub">6 current-standard reconstructions from Rev.6 Annex 8 figs.14–16 · legacy v5 artwork excluded · 1.63.33 untouched</div><div class="bar"><button onclick="filter('all')">ALL 6</button><button onclick="filter('unreviewed')">UNREVIEWED</button><button onclick="filter('approved')">APPROVED</button><button onclick="filter('rejected')">REJECTED</button><button onclick="filter('hold')">HOLD</button><button onclick="showResults()">SHOW / COPY RESULTS</button></div></header><main id="cards"></main><pre id="results"></pre>
<script>
const items=[
['6.A','Fixed bifurcation mark — with light','bifLight','Red cone point down above green cone point up; white scintillating/isophase light'],
['6.B','Fixed bifurcation mark — without light','bif','Red cone point down above green cone point up'],
['1.F1','Danger/obstacle — right-hand spar','redSpar','Horizontal red/white bands; red cylindrical topmark'],
['1.F','Danger/obstacle — right-hand spar-buoy','redBuoy','Horizontal red/white bands; red cylindrical topmark'],
['2.F1','Danger/obstacle — left-hand spar','greenSpar','Horizontal green/white bands; green cone topmark point upwards'],
['2.F','Danger/obstacle — left-hand spar-buoy','greenBuoy','Horizontal green/white bands; green cone topmark point upwards']];
const KEY='pwCevniLatestGraphicsBatch02';let db=JSON.parse(localStorage.getItem(KEY)||'{}');
function water(){return '<path d="M80 250h160M95 264h55m25 0h50" stroke="#222" stroke-width="3" fill="none"/>'}
function striped(x,y,w,h,c,n=5){let s='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'" stroke="#111" stroke-width="3"/>';let bh=h/n;for(let i=1;i<n;i+=2)s+='<rect x="'+x+'" y="'+(y+i*bh)+'" width="'+w+'" height="'+bh+'" fill="white"/>';return s}
function svg(t){if(t==='bif'||t==='bifLight'){return '<svg viewBox="0 0 320 300">'+(t==='bifLight'?'<circle cx="160" cy="47" r="12" fill="white" stroke="#111" stroke-width="3"/><path d="M160 22v12M135 31l10 10M185 31l-10 10M128 48h18M174 48h18" stroke="#777" stroke-width="2"/>':'')+'<polygon points="115,85 205,85 160,153" fill="#e30613" stroke="#111" stroke-width="3"/><polygon points="160,153 115,220 205,220" fill="#008c4a" stroke="#111" stroke-width="3"/><path d="M160 220v55" stroke="#222" stroke-width="4"/></svg>'}
let green=t.startsWith('green'), buoy=t.endsWith('Buoy'), c=green?'#008c4a':'#e30613';
let top=green?'<polygon points="160,42 130,88 190,88" fill="'+c+'" stroke="#111" stroke-width="3"/>':'<rect x="137" y="43" width="46" height="38" fill="'+c+'" stroke="#111" stroke-width="3"/>';
if(!buoy)return '<svg viewBox="0 0 320 300">'+top+striped(145,90,30,145,c,5)+water()+'</svg>';
return '<svg viewBox="0 0 320 300">'+top+striped(150,87,20,115,c,5)+'<path d="M137 202h46l10 33 43 22v18H84v-18l43-22z" fill="'+c+'" stroke="#111" stroke-width="3"/>'+water()+'</svg>'}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){cards.innerHTML=items.map(x=>{let id='PW-CEVNI-ANNEX8-'+x[0].replace('.','-'),r=db[id]||{status:'unreviewed',note:''};return '<article class="card" data-id="'+id+'" data-status="'+r.status+'"><div class="art">'+svg(x[2])+'</div><div class="body"><div class="code">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[3]+'</p><small>'+id+' · CLEAN REV.6 RECONSTRUCTION · HUMAN APPROVAL REQUIRED</small><div class="buttons"><button class="approve" onclick="setState(this,\'approved\')">✓ APPROVE</button><button class="reject" onclick="setState(this,\'rejected\')">✕ REJECT</button><button class="hold" onclick="setState(this,\'hold\')">? HOLD</button></div><textarea placeholder="Optional note" oninput="saveNote(this)">'+esc(r.note)+'</textarea></div></article>'}).join('')}
function setState(b,s){let c=b.closest('.card'),id=c.dataset.id;c.dataset.status=s;db[id]={status:s,note:c.querySelector('textarea').value};localStorage.setItem(KEY,JSON.stringify(db))}
function saveNote(t){let c=t.closest('.card'),id=c.dataset.id;db[id]=db[id]||{status:c.dataset.status};db[id].note=t.value;localStorage.setItem(KEY,JSON.stringify(db))}
function filter(s){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',s!=='all'&&c.dataset.status!==s))}
async function showResults(){let out={version:'latest-graphics-batch-02',authority:'CEVNI Rev.6 Annex 8 figs.14-16; Corr.1/Corr.2 and Amendments 1/2 checked before promotion',old_v5_artwork:'EXCLUDED',review:db},txt=JSON.stringify(out,null,2),p=document.getElementById('results');p.textContent=txt;p.style.display='block';p.scrollIntoView({behavior:'smooth'});try{await navigator.clipboard.writeText(txt);alert('Results copied. Paste them back into ChatGPT.')}catch(e){alert('Results shown below. Select and copy them into ChatGPT.')}}
render();</script></body></html>
