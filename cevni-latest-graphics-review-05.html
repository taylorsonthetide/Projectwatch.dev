<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEVNI Latest Graphics Approval Batch 05</title><style>
body{margin:0;background:#07151c;color:#eef9fc;font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b2632;padding:16px;border-bottom:1px solid #28505e}h1{font-size:22px;margin:0}.sub{color:#b8d5de;margin:5px 0 10px}.bar{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:9px 11px;font-weight:800}.bar button{background:#183b48;color:#fff}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;padding:16px}.card{background:#0e222b;border:2px solid #244854;border-radius:14px;overflow:hidden}.card[data-status=approved]{border-color:#4ac78a}.card[data-status=rejected]{border-color:#e96c6c}.card[data-status=hold]{border-color:#e8bd59}.art{height:290px;background:#fff}.art svg{width:100%;height:100%}.body{padding:13px}.code{font-size:23px;color:#79e0ff;font-weight:900}h3{font-size:16px;margin:4px 0 7px}p,small{color:#b8d5de}.buttons{display:flex;gap:6px;margin-top:11px}.approve{background:#4ac78a}.reject{background:#e96c6c}.hold{background:#e8bd59}textarea{box-sizing:border-box;width:100%;min-height:50px;margin-top:9px;background:#07151c;color:#fff;border:1px solid #315b68;border-radius:8px;padding:8px}.hidden{display:none}#results{display:none;margin:16px;background:#fff;color:#111;padding:12px;border-radius:10px;white-space:pre-wrap}</style></head><body>
<header><h1>PROJECT WATCH · CEVNI LATEST GRAPHICS · APPROVAL BATCH 05</h1><div class="sub">Safe-water & special-area marks · Rev.6 Annex 8 figs.24 / 24 bis · legacy v5 excluded · 1.63.33 untouched</div><div class="bar"><button onclick="filter('all')">ALL 5</button><button onclick="filter('unreviewed')">UNREVIEWED</button><button onclick="filter('approved')">APPROVED</button><button onclick="filter('rejected')">REJECTED</button><button onclick="filter('hold')">HOLD</button><button onclick="showResults()">SHOW / COPY RESULTS</button></div></header><main id="cards"></main><pre id="results"></pre><script>
const items=[['8.E','Safe-water mark — spherical buoy','sphere','Red/white vertical stripes; spherical form'],['8.E1','Safe-water mark — pillar','pillar','Red/white vertical stripes; single red sphere topmark'],['8.E2','Safe-water mark — spar','spar','Red/white vertical stripes; single red sphere topmark'],['8.F','Special-area mark — buoy','specialBuoy','Yellow; optional shape; single yellow X topmark'],['8.F1','Special-area mark — spar','specialSpar','Yellow; optional shape; single yellow X topmark']];
const KEY='pwCevniLatestGraphicsBatch05';let db=JSON.parse(localStorage.getItem(KEY)||'{}');
const water='<path d="M80 252h160M100 264h45m30 0h45" stroke="#387ba0" stroke-width="3"/>';
function stripedPillar(){return '<path d="M130 112h60l15 130h-90z" fill="#fff" stroke="#111" stroke-width="3"/><path d="M130 112h20l-12 130h-23zM170 112h20l15 130h-23z" fill="#e30613"/>'}
function stripedSpar(){return '<rect x="140" y="112" width="40" height="130" fill="#fff" stroke="#111" stroke-width="3"/><rect x="140" y="112" width="13" height="130" fill="#e30613"/><rect x="167" y="112" width="13" height="130" fill="#e30613"/>'}
function svg(t){if(t==='sphere')return '<svg viewBox="0 0 320 290"><defs><clipPath id="c"><circle cx="160" cy="170" r="68"/></clipPath></defs><circle cx="160" cy="170" r="68" fill="#fff" stroke="#111" stroke-width="3"/><g clip-path="url(#c)"><rect x="92" y="102" width="27" height="136" fill="#e30613"/><rect x="146" y="102" width="28" height="136" fill="#e30613"/><rect x="201" y="102" width="27" height="136" fill="#e30613"/></g>'+water+'</svg>';
if(t==='pillar'||t==='spar')return '<svg viewBox="0 0 320 290"><circle cx="160" cy="70" r="25" fill="#e30613" stroke="#111" stroke-width="3"/>'+(t==='pillar'?stripedPillar():stripedSpar())+water+'</svg>';
let buoy=t==='specialBuoy';return '<svg viewBox="0 0 320 290"><path d="M135 48l50 50M185 48l-50 50" stroke="#ffd21c" stroke-width="14"/>'+(buoy?'<path d="M130 115h60l18 127h-96z" fill="#ffd21c" stroke="#111" stroke-width="3"/>':'<rect x="143" y="112" width="34" height="130" fill="#ffd21c" stroke="#111" stroke-width="3"/>')+water+'</svg>'}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){cards.innerHTML=items.map(x=>{let id='PW-CEVNI-ANNEX8-'+x[0].replace('.','-'),r=db[id]||{status:'unreviewed',note:''};return '<article class="card" data-id="'+id+'" data-status="'+r.status+'"><div class="art">'+svg(x[2])+'</div><div class="body"><div class="code">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[3]+'</p><small>'+id+' · CLEAN REV.6 RECONSTRUCTION · HUMAN APPROVAL REQUIRED</small><div class="buttons"><button class="approve" onclick="setState(this,\'approved\')">✓ APPROVE</button><button class="reject" onclick="setState(this,\'rejected\')">✕ REJECT</button><button class="hold" onclick="setState(this,\'hold\')">? HOLD</button></div><textarea placeholder="Optional note" oninput="saveNote(this)">'+esc(r.note)+'</textarea></div></article>'}).join('')}
function setState(b,s){let c=b.closest('.card'),id=c.dataset.id;c.dataset.status=s;db[id]={status:s,note:c.querySelector('textarea').value};localStorage.setItem(KEY,JSON.stringify(db))}
function saveNote(t){let c=t.closest('.card'),id=c.dataset.id;db[id]=db[id]||{status:c.dataset.status};db[id].note=t.value;localStorage.setItem(KEY,JSON.stringify(db))}
function filter(s){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',s!=='all'&&c.dataset.status!==s))}
async function showResults(){let out={version:'latest-graphics-batch-05',authority:'CEVNI Rev.6 Annex 8 figs.24 and 24 bis; Corr.1/Corr.2 and Amendments 1/2 checked before promotion',old_v5_artwork:'EXCLUDED',review:db},txt=JSON.stringify(out,null,2),p=document.getElementById('results');p.textContent=txt;p.style.display='block';p.scrollIntoView({behavior:'smooth'});try{await navigator.clipboard.writeText(txt);alert('Results copied. Paste them back into ChatGPT.')}catch(e){alert('Results shown below. Select and copy them into ChatGPT.')}}
render();</script></body></html>
