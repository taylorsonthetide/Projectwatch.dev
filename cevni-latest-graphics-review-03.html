<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEVNI Latest Graphics Approval Batch 03</title><style>
body{margin:0;background:#07151c;color:#eef9fc;font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b2632;padding:16px;border-bottom:1px solid #28505e}h1{font-size:22px;margin:0}.sub{color:#b8d5de;margin:5px 0 10px}.bar{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:9px 11px;font-weight:800}.bar button{background:#183b48;color:#fff}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:16px}.card{background:#0e222b;border:2px solid #244854;border-radius:14px;overflow:hidden}.card[data-status=approved]{border-color:#4ac78a}.card[data-status=rejected]{border-color:#e96c6c}.card[data-status=hold]{border-color:#e8bd59}.art{height:300px;background:#fff;display:grid;place-items:center}.art svg{width:100%;height:100%}.body{padding:13px}.code{font-size:23px;color:#79e0ff;font-weight:900}h3{font-size:16px;margin:4px 0 7px}p,small{color:#b8d5de}.buttons{display:flex;gap:6px;margin-top:11px}.approve{background:#4ac78a}.reject{background:#e96c6c}.hold{background:#e8bd59}textarea{box-sizing:border-box;width:100%;min-height:50px;margin-top:9px;background:#07151c;color:#fff;border:1px solid #315b68;border-radius:8px;padding:8px}.hidden{display:none}#results{display:none;margin:16px;background:#fff;color:#111;padding:12px;border-radius:10px;white-space:pre-wrap}</style></head><body>
<header><h1>PROJECT WATCH · CEVNI LATEST GRAPHICS · APPROVAL BATCH 03</h1><div class="sub">Radar marking · Rev.6 Annex 8 figs.18–21 · legacy v5 artwork excluded · 1.63.33 untouched</div><div class="bar"><button onclick="filter('all')">ALL 5</button><button onclick="filter('unreviewed')">UNREVIEWED</button><button onclick="filter('approved')">APPROVED</button><button onclick="filter('rejected')">REJECTED</button><button onclick="filter('hold')">HOLD</button><button onclick="showResults()">SHOW / COPY RESULTS</button></div></header><main id="cards"></main><pre id="results"></pre>
<script>
const items=[['8.C','Bridge-pier radar marking — yellow float','c','Yellow float with radar reflector, placed upstream/downstream from bridge pier'],['8.C1','Bridge-pier radar marking — paired arrangement','c1','Yellow radar-reflector floats marking bridge pier'],['8.C2','Bridge-pier radar marking — reflector pole','c2','Pole with radar reflector upstream/downstream from bridge pier'],['8.C3','Overhead cable — reflectors on cable','c3','Radar reflectors secured to overhead cable; radar image is a series of points'],['8.C4','Overhead cable — paired reflector floats','c4','Yellow radar-reflector floats arranged in pairs near each bank']];
const KEY='pwCevniLatestGraphicsBatch03';let db=JSON.parse(localStorage.getItem(KEY)||'{}');
const refl=(x,y)=>'<g stroke="#111" stroke-width="3" fill="#d8d8d8"><polygon points="'+(x-18)+','+y+' '+x+','+(y-16)+' '+(x+18)+','+y+' '+x+','+(y+16)+'"/><path d="M'+(x-18)+' '+y+'h36M'+x+' '+(y-16)+'v32"/></g>';
const float=(x,y)=>'<g><path d="M'+(x-28)+' '+y+' Q'+x+' '+(y-20)+' '+(x+28)+' '+y+' L'+(x+20)+' '+(y+24)+' Q'+x+' '+(y+34)+' '+(x-20)+' '+(y+24)+'Z" fill="#ffd21c" stroke="#111" stroke-width="3"/>'+refl(x,y-34)+'</g>';
function svg(t){let w='<path d="M35 257q30-12 60 0t60 0t60 0t60 0" fill="none" stroke="#387ba0" stroke-width="3"/>';
if(t==='c')return '<svg viewBox="0 0 320 300"><rect x="232" y="65" width="35" height="185" fill="#777" stroke="#111" stroke-width="3"/>'+float(130,205)+w+'</svg>';
if(t==='c1')return '<svg viewBox="0 0 320 300"><rect x="145" y="55" width="30" height="195" fill="#777" stroke="#111" stroke-width="3"/>'+float(80,205)+float(240,205)+w+'</svg>';
if(t==='c2')return '<svg viewBox="0 0 320 300"><rect x="236" y="62" width="32" height="188" fill="#777" stroke="#111" stroke-width="3"/><path d="M115 235V95" stroke="#444" stroke-width="8"/>'+refl(115,82)+w+'</svg>';
if(t==='c3')return '<svg viewBox="0 0 320 300"><path d="M25 88 Q160 150 295 88" fill="none" stroke="#333" stroke-width="4"/>'+refl(75,106)+refl(125,121)+refl(175,121)+refl(225,106)+'<path d="M40 88v170M280 88v170" stroke="#555" stroke-width="8"/>'+w+'</svg>';
return '<svg viewBox="0 0 320 300"><path d="M25 70 Q160 125 295 70" fill="none" stroke="#333" stroke-width="4"/><path d="M40 70v185M280 70v185" stroke="#555" stroke-width="8"/>'+float(90,210)+float(140,210)+float(210,210)+float(260,210)+w+'</svg>'}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){cards.innerHTML=items.map(x=>{let id='PW-CEVNI-ANNEX8-'+x[0].replace('.','-'),r=db[id]||{status:'unreviewed',note:''};return '<article class="card" data-id="'+id+'" data-status="'+r.status+'"><div class="art">'+svg(x[2])+'</div><div class="body"><div class="code">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[3]+'</p><small>'+id+' · CLEAN REV.6 RECONSTRUCTION · HUMAN APPROVAL REQUIRED</small><div class="buttons"><button class="approve" onclick="setState(this,\'approved\')">✓ APPROVE</button><button class="reject" onclick="setState(this,\'rejected\')">✕ REJECT</button><button class="hold" onclick="setState(this,\'hold\')">? HOLD</button></div><textarea placeholder="Optional note" oninput="saveNote(this)">'+esc(r.note)+'</textarea></div></article>'}).join('')}
function setState(b,s){let c=b.closest('.card'),id=c.dataset.id;c.dataset.status=s;db[id]={status:s,note:c.querySelector('textarea').value};localStorage.setItem(KEY,JSON.stringify(db))}
function saveNote(t){let c=t.closest('.card'),id=c.dataset.id;db[id]=db[id]||{status:c.dataset.status};db[id].note=t.value;localStorage.setItem(KEY,JSON.stringify(db))}
function filter(s){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',s!=='all'&&c.dataset.status!==s))}
async function showResults(){let out={version:'latest-graphics-batch-03',authority:'CEVNI Rev.6 Annex 8 figs.18-21; Corr.1/Corr.2 and Amendments 1/2 checked before promotion',old_v5_artwork:'EXCLUDED',review:db},txt=JSON.stringify(out,null,2),p=document.getElementById('results');p.textContent=txt;p.style.display='block';p.scrollIntoView({behavior:'smooth'});try{await navigator.clipboard.writeText(txt);alert('Results copied. Paste them back into ChatGPT.')}catch(e){alert('Results shown below. Select and copy them into ChatGPT.')}}
render();</script></body></html>
