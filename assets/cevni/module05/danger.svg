<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-label="DANGER AND DISTRESS training diagram"><rect width="680" height="240" rx="20" fill="#092d3f"/><rect x="16" y="16" width="648" height="208" rx="12" fill="#123d50" stroke="#5daec1" stroke-width="2"/><text x="36" y="55" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#f8dc81">DANGER AND DISTRESS</text><text x="38" y="103" font-family="Arial,sans-serif" font-size="20" fill="white">• ━  repeated  →  Do not approach</text><text x="38" y="150" font-family="Arial,sans-serif" font-size="20" fill="white">••••••  →  Imminent collision risk</text><text x="38" y="197" font-family="Arial,sans-serif" font-size="20" fill="white">━━━━  repeated  →  Distress</text></svg>