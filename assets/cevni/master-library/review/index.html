<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Watch CEVNI Master Library Review</title><style>body{font-family:system-ui;background:#07151c;color:#eef9fc;margin:0}header{position:sticky;top:0;z-index:5;background:#0b2632;padding:18px;border-bottom:1px solid #28505e}h1{margin:0;font-size:24px}.sub{color:#b8d5de;margin:5px 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:9px 11px;font-weight:700;cursor:pointer}.toolbar button{background:#183b48;color:white}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;padding:16px}.card{background:#0e222b;border:2px solid #244854;border-radius:14px;overflow:hidden}.card[data-status=approved]{border-color:#4ac78a}.card[data-status=rejected]{border-color:#e96c6c}.card[data-status=hold]{border-color:#e8bd59}.art,.pending{width:100%;height:230px;object-fit:contain;background:white}.pending{display:grid;place-items:center;background:#142f39;color:#ffd26f;font-weight:800}.body{padding:13px}.code{font-size:22px;color:#79e0ff;font-weight:800}h3{font-size:16px;margin:5px 0}p,small{color:#b8d5de}.buttons{display:flex;gap:6px;margin-top:12px}.approve{background:#4ac78a}.reject{background:#e96c6c}.hold{background:#e8bd59}textarea{box-sizing:border-box;width:100%;margin-top:9px;min-height:55px;background:#07151c;color:white;border:1px solid #315b68;border-radius:8px;padding:8px}.hidden{display:none}#loading{padding:30px;color:#b8d5de}</style></head><body><header><h1>PROJECT WATCH · CEVNI MASTER VISUAL LIBRARY</h1><div class="sub">Human review gate · CEVNI Rev.6 + Corrigenda 1 & 2 · live Project Watch 1.63.33 untouched</div><div class="toolbar"><button onclick="filterState('all')">ALL</button><button onclick="filterState('unreviewed')">UNREVIEWED</button><button onclick="filterState('approved')">APPROVED</button><button onclick="filterState('rejected')">REJECTED</button><button onclick="filterState('hold')">HOLD</button><button onclick="filterAnnex('7')">ANNEX 7</button><button onclick="filterAnnex('8')">ANNEX 8</button><button onclick="exportJSON()">EXPORT REVIEW JSON</button></div></header><div id="loading">Loading master manifest…</div><main id="cards"></main><script>
const KEY='pwCevniMasterReviewV1';let db=JSON.parse(localStorage.getItem(KEY)||'{}'),entries=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
fetch('../data/cevni_visual_library_manifest.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{entries=d.entries||[];render();document.getElementById('loading').remove()}).catch(e=>document.getElementById('loading').textContent='Manifest not ready: '+e);
function render(){document.getElementById('cards').innerHTML=entries.map(e=>{let r=db[e.asset_id]||{status:'unreviewed',note:''};let art=e.artwork_file?'<img class="art" src="../'+esc(e.artwork_file)+'" loading="lazy">':'<div class="pending">ARTWORK EXTRACTION PENDING</div>';return '<article class="card" data-annex="'+esc(e.annex)+'" data-status="'+r.status+'" data-id="'+esc(e.asset_id)+'">'+art+'<div class="body"><div class="code">'+esc(e.code)+'</div><h3>'+esc(e.official_identity)+'</h3><p>'+esc(e.family)+'</p><small>'+esc(e.asset_id)+'<br>Source: '+esc(e.source_annex)+' · PDF p.'+esc(e.source_pdf_page)+'<br>Artwork: '+esc(e.artwork_status)+'</small><div class="buttons"><button class="approve" onclick="setState(this,\'approved\')">✓ APPROVE</button><button class="reject" onclick="setState(this,\'rejected\')">✕ REJECT</button><button class="hold" onclick="setState(this,\'hold\')">? HOLD</button></div><textarea placeholder="Optional review note" oninput="note(this)">'+esc(r.note)+'</textarea></div></article>'}).join('')}
function save(c){db[c.dataset.id]={status:c.dataset.status,note:c.querySelector('textarea').value};localStorage.setItem(KEY,JSON.stringify(db))}
function setState(b,s){let c=b.closest('.card');c.dataset.status=s;save(c)}
function note(t){save(t.closest('.card'))}
function filterState(s){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',s!='all'&&c.dataset.status!=s))}
function filterAnnex(a){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',c.dataset.annex!=a))}
function exportJSON(){let blob=new Blob([JSON.stringify({library:'Project Watch CEVNI Master Visual Library',review:db},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Project_Watch_CEVNI_Master_Review.json';a.click();URL.revokeObjectURL(u)}
</script></body></html>
