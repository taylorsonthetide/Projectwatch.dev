<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">07  TAKE A BEARING</title><desc id="desc">A bearing points from your position toward an identified object.</desc><rect width="1000" height="550" fill="#eaf4f6"/><rect x="24" y="22" width="952" height="506" rx="24" fill="#fafdfe" stroke="#b9d7de" stroke-width="2"/><text x="54" y="72" fill="#173b50" font-size="35" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">07  TAKE A BEARING</text><text x="54" y="104" fill="#527986" font-size="17" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">A bearing points from your position toward an identified object.</text><rect x="76" y="154" width="850" height="297" rx="18" fill="#fff" stroke="#b9d6dc" stroke-width="2"/><text x="129" y="343" fill="#173b50" font-size="25" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">YOUR BOAT</text><text x="724" y="226" fill="#173b50" font-size="25" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">LIGHTHOUSE</text><line x1="280" y1="320" x2="731" y2="235" stroke="#df754e" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 8"/><text x="465" y="251" fill="#bb5c3e" font-size="25" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">079° C bearing</text><text x="139" y="398" fill="#527986" font-size="21" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Convert C → M → T before plotting on a true chart.</text><rect x="54" y="486" width="892" height="24" rx="8" fill="#e2f0f2"/><text x="68" y="503" fill="#477683" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">SCHEMATIC • FICTIONAL DIRECTIONS • NOT FOR NAVIGATION</text></svg>