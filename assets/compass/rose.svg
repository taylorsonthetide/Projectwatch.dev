<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Compass circle with eight points</title><desc id="desc">Precise schematic of the eight compass points and their three digit directions</desc><defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#65a4b3"/><stop offset="1" stop-color="#164863"/></linearGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffef3"/><stop offset="1" stop-color="#e8ebdb"/></linearGradient><filter id="shade"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter><pattern id="wave" width="68" height="26" patternUnits="userSpaceOnUse"><path d="M0 13Q17 4 34 13T68 13" fill="none" stroke="#d2edec" stroke-opacity=".25" stroke-width="2"/></pattern></defs><rect width="1000" height="550" fill="#edf5f5"/><rect x="24" y="22" width="952" height="506" rx="24" fill="#fcfefd" stroke="#bad8dc" stroke-width="2"/><text x="54" y="73" font-family="Arial,sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#123c50">01  THE COMPASS CIRCLE</text><text x="54" y="106" font-family="Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#547986">Degrees increase clockwise from north.</text><circle cx="500" cy="298" r="170" fill="#fff" stroke="#235e72" stroke-width="5"/><text x="500.0" y="180.0" font-family="Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#1c5164">000° N</text><text x="587.7" y="216.3" font-family="Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#1c5164">045° NE</text><text x="624.0" y="304.0" font-family="Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#1c5164">090° E</text><text x="587.7" y="391.7" font-family="Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#1c5164">135° SE</text><text x="500.0" y="428.0" font-family="Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#1c5164">180° S</text><text x="412.3" y="391.7" font-family="Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#1c5164">225° SW</text><text x="376.0" y="304.0" font-family="Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#1c5164">270° W</text><text x="412.3" y="216.3" font-family="Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#1c5164">315° NW</text><text x="500" y="464" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#517a83">A full turn returns to 000° / 360°.</text></svg>