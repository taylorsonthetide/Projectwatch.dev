<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Chart bearing line and reciprocal</title><desc id="desc">A lighthouse 045 degrees true from a boat and the reciprocal 225 degrees true line from the lighthouse back toward the boat</desc><defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#65a4b3"/><stop offset="1" stop-color="#164863"/></linearGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffef3"/><stop offset="1" stop-color="#e8ebdb"/></linearGradient><filter id="shade"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter><pattern id="wave" width="68" height="26" patternUnits="userSpaceOnUse"><path d="M0 13Q17 4 34 13T68 13" fill="none" stroke="#d2edec" stroke-opacity=".25" stroke-width="2"/></pattern></defs><rect width="1000" height="550" fill="#715b46"/><g transform="rotate(-2 500 270)" filter="url(#shade)"><rect x="45" y="28" width="910" height="489" rx="10" fill="url(#paper)"/><path d="M70 82H926M70 453H926M95 60V480M890 60V480" stroke="#abcac5" stroke-width="2"/><path d="M780 60Q754 130 812 190T861 377" fill="none" stroke="#9ebcc0" stroke-width="8"/></g><rect x="67" y="55" width="530" height="82" rx="14" fill="#0d4053"/><text x="89" y="92" font-family="Arial,sans-serif" font-size="28" font-weight="800" text-anchor="start" fill="#fff">PLOT A TRUE BEARING</text><text x="89" y="122" font-family="Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#cce9e9">One observation gives a line, not a fix.</text><path d="M470 380L690 160" stroke="#d76d48" stroke-width="6" stroke-dasharray="12 9"/><circle cx="470" cy="380" r="18" fill="#f6f9f0" stroke="#2e6673" stroke-width="5"/><circle cx="690" cy="160" r="17" fill="#f9edbd" stroke="#bd6246" stroke-width="6"/><path d="M690 144V103M671 119H709" stroke="#be6a49" stroke-width="6"/><path d="M530 322L547 307L545 333" fill="none" stroke="#c25e42" stroke-width="5"/><path d="M615 238L594 261L619 256" fill="none" stroke="#256c79" stroke-width="5"/><text x="715" y="166" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#244e59">LIGHTHOUSE</text><text x="359" y="418" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#244e59">BOAT</text><text x="350" y="271" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#ad573e">045° T TO OBJECT</text><text x="642" y="360" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#ad573e">225° T BACK</text><text x="500" y="483" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#3f6e76">Plot back from the object on the reciprocal line.</text></svg>