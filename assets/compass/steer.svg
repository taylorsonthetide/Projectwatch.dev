<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">08  STEER AND VERIFY</title><desc id="desc">Plan → steer → observe → correct.</desc><rect width="1000" height="550" fill="#eaf4f6"/><rect x="24" y="22" width="952" height="506" rx="24" fill="#fafdfe" stroke="#b9d7de" stroke-width="2"/><text x="54" y="72" fill="#173b50" font-size="35" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">08  STEER AND VERIFY</text><text x="54" y="104" fill="#527986" font-size="17" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Plan → steer → observe → correct.</text><rect x="64" y="158" width="267" height="274" rx="18" fill="#fff" stroke="#b9d6dc" stroke-width="2"/><rect x="366" y="158" width="267" height="274" rx="18" fill="#fff" stroke="#b9d6dc" stroke-width="2"/><rect x="668" y="158" width="267" height="274" rx="18" fill="#fff" stroke="#b9d6dc" stroke-width="2"/><text x="197" y="222" fill="#173b50" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">PLAN</text><text x="197" y="283" fill="#27758b" font-size="23" font-weight="500" text-anchor="middle" font-family="Arial, sans-serif">Chart course</text><text x="197" y="327" fill="#27758b" font-size="23" font-weight="500" text-anchor="middle" font-family="Arial, sans-serif">Corrections</text><text x="499" y="222" fill="#173b50" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">STEER</text><text x="499" y="283" fill="#27758b" font-size="23" font-weight="500" text-anchor="middle" font-family="Arial, sans-serif">Lubber line</text><text x="499" y="327" fill="#27758b" font-size="23" font-weight="500" text-anchor="middle" font-family="Arial, sans-serif">Steady heading</text><text x="801" y="222" fill="#173b50" font-size="28" font-weight="800" text-anchor="middle" font-family="Arial, sans-serif">VERIFY</text><text x="801" y="283" fill="#27758b" font-size="23" font-weight="500" text-anchor="middle" font-family="Arial, sans-serif">Landmarks</text><text x="801" y="327" fill="#27758b" font-size="23" font-weight="500" text-anchor="middle" font-family="Arial, sans-serif">Position / track</text><text x="500" y="462" fill="#527986" font-size="21" font-weight="600" text-anchor="middle" font-family="Arial, sans-serif">Check the reference shown by each instrument: C, M or T.</text><rect x="54" y="486" width="892" height="24" rx="8" fill="#e2f0f2"/><text x="68" y="503" fill="#477683" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">SCHEMATIC • FICTIONAL DIRECTIONS • NOT FOR NAVIGATION</text></svg>