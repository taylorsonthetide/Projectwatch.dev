<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">06  HEADING IS NOT TRACK</title><desc id="desc">Bow direction and movement over ground are different measurements.</desc><rect width="1000" height="550" fill="#eaf4f6"/><rect x="24" y="22" width="952" height="506" rx="24" fill="#fafdfe" stroke="#b9d7de" stroke-width="2"/><text x="54" y="72" fill="#173b50" font-size="35" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">06  HEADING IS NOT TRACK</text><text x="54" y="104" fill="#527986" font-size="17" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Bow direction and movement over ground are different measurements.</text><rect x="79" y="159" width="405" height="276" rx="18" fill="#fff" stroke="#b9d6dc" stroke-width="2"/><text x="110" y="204" fill="#173b50" font-size="24" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">BOAT / HEADING</text><line x1="180" y1="307" x2="335" y2="307" stroke="#df754e" stroke-width="8" stroke-linecap="round" /><path d="M276 238 l-12 22 m12 -22 l12 22" transform="rotate(0.0 276 238)" fill="none" stroke="#df754e" stroke-width="8" stroke-linecap="round"/><text x="255" y="277" fill="#bc633d" font-size="28" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">090°</text><rect x="517" y="159" width="405" height="276" rx="18" fill="#fff" stroke="#b9d6dc" stroke-width="2"/><text x="547" y="204" fill="#173b50" font-size="23" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">GROUND TRACK / COG</text><line x1="606" y1="293" x2="818" y2="350" stroke="#24768b" stroke-width="8" stroke-linecap="round" /><text x="647" y="267" fill="#17624f" font-size="27" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">105° COG</text><text x="500" y="459" fill="#527986" font-size="18" font-weight="500" text-anchor="middle" font-family="Arial, sans-serif">Illustrative only: direction d