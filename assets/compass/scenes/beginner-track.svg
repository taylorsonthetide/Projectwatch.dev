<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Overhead boat and wake showing heading and ground track</title><desc id="desc">Boat points east at heading 090 while its illustrated ground track runs southeast at 105 degrees course over ground</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#82b6ca"/><stop offset="1" stop-color="#d9ebea"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#396f83"/><stop offset="1" stop-color="#123c5c"/></linearGradient><linearGradient id="helm" x2="0" y2="1"><stop stop-color="#667d80"/><stop offset=".45" stop-color="#263e48"/><stop offset="1" stop-color="#0b2733"/></linearGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffdf4"/><stop offset="1" stop-color="#e8e9d8"/></linearGradient><filter id="shade"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".22"/></filter><pattern id="waves" width="65" height="24" patternUnits="userSpaceOnUse"><path d="M0 12 Q15 4 31 12 T65 12" fill="none" stroke="#b5dce0" stroke-opacity=".25" stroke-width="2"/></pattern></defs><rect width="1000" height="550" fill="url(#sea)"/><rect width="1000" height="550" fill="url(#waves)"/><path d="M0 310C170 295 230 315 320 314S450 330 510 342" fill="none" stroke="#d3e5e4" stroke-opacity=".55" stroke-width="28"/><path d="M0 320C190 304 300 325 510 342" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="5"/><path d="M338 337L542 337" fill="none" stroke="#ffa473" stroke-width="10" stroke-linecap="round"/><path d="M528 323L552 337L528 351" fill="none" stroke="#ffa473" stroke-width="9" stroke-linejoin="round"/><path d="M338 362L597 431" fill="none" stroke="#a6eddf" stroke-width="8" stroke-dasharray="14 11" stroke-linecap="round"/><path d="M578 411L604 434L568 441" fill="none" stroke="#a6eddf" stroke-width="8" stroke-linejoin="round"/><g transform="translate(326 337) rotate(90)" filter="url(#shade)"><path d="M0 -120C45 -84 54 -14 46 78L23 109H-23L-46 78C-54 -14 -45 -84 0 -120Z" fill="#f6f3e7" stroke="#1c4753" stroke-width="5"/><path d="M0 -68L30 -33L25 39H-25L-30 -33Z" fill="#6d9db2" stroke="#234d59" stroke-width="4"/><path d="M-28 56H28" stroke="#a18262" stroke-width="9"/><path d="M0 -106V-70" stroke="#d97148" stroke-width="4"/></g><rect x="55" y="46" width="580" height="106" rx="16" fill="#0a3446" fill-opacity=".88"/><text x="80" y="88" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#fff">SAME BOAT. TWO DIRECTIONS.</text><text x="80" y="125" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="500" fill="#c8ebed">Bow points east; the ground track bends southeast.</text><rect x="652" y="199" width="291" height="116" rx="14" fill="#fffaf0" filter="url(#shade)"/><rect x="652" y="335" width="291" height="116" rx="14" fill="#ecfaf6" filter="url(#shade)"/><text x="673" y="235" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#8a563e">COMPASS HEADING</text><text x="673" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#b3593c">090°</text><text x="673" y="371" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1c726b">GPS GROUND TRACK</text><text x="673" y="422" text-anchor="start" font-family="Arial,sans-serif" font-size="39" font-weight="800" fill="#176b67">105° COG</text></svg>