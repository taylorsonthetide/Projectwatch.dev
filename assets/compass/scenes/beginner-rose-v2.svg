<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Eight compass points with three-digit degrees</title><desc id="desc">Compass rose showing north 000, northeast 045, east 090, southeast 135, south 180, southwest 225, west 270 and northwest 315 degrees</desc><defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#65a4b3"/><stop offset="1" stop-color="#164863"/></linearGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffef3"/><stop offset="1" stop-color="#e8ebdb"/></linearGradient><filter id="shade"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter><pattern id="wave" width="68" height="26" patternUnits="userSpaceOnUse"><path d="M0 13Q17 4 34 13T68 13" fill="none" stroke="#d2edec" stroke-opacity=".25" stroke-width="2"/></pattern></defs><rect width="1000" height="550" fill="#705a48"/><path d="M0 0H1000V550H0Z" fill="#826a54"/><g transform="rotate(-2 480 280)" filter="url(#shade)"><rect x="48" y="30" width="904" height="490" rx="13" fill="url(#paper)"/><path d="M68 83H929M68 464H929M100 48V499M895 48V499" stroke="#aad0ca" stroke-width="2"/></g><rect x="72" y="55" width="419" height="82" rx="15" fill="#103e52"/><text x="94" y="91" font-family="Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start" fill="#fff">THE COMPASS CIRCLE</text><text x="94" y="122" font-family="Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#cce8e8">Start north. Count clockwise.</text><circle cx="500" cy="325" r="173" fill="#fafff6" stroke="#1c5b70" stroke-width="7" filter="url(#shade)"/><path d="M500.0 170.0L500.0 157.0" stroke="#296a79" stroke-width="4"/><text x="500.0" y="234.0" font-family="Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#1b4d61">N</text><text x="500.0" y="172.0" font-family="Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#a4523b">000°</text><path d="M609.6 215.4L618.8 206.2" stroke="#296a79" stroke-width="4"/><text x="569.3" y="262.7" font-family="Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#1b4d61">NE</text><text x="611.7" y="218.3" font-family="Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#a4523b">045°</text><path d="M655.0 325.0L668.0 325.0" stroke="#296a79" stroke-width="4"/><text x="598.0" y="332.0" font-family="Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#1b4d61">E</text><text x="658.0" y="330.0" font-family="Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#a4523b">090°</text><path d="M609.6 434.6L618.8 443.8" stroke="#296a79" stroke-width="4"/><text x="569.3" y="401.3" font-family="Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#1b4d61">SE</text><text x="611.7" y="441.7" font-family="Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#a4523b">135°</text><path d="M500.0 480.0L500.0 493.0" stroke="#296a79" stroke-width="4"/><text x="500.0" y="430.0" font-family="Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#1b4d61">S</text><text x="500.0" y="488.0" font-family="Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#a4523b">180°</text><path d="M390.4 434.6L381.2 443.8" stroke="#296a79" stroke-width="4"/><text x="430.7" y="401.3" font-family="Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#1b4d61">SW</text><text x="388.3" y="441.7" font-family="Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#a4523b">225°</text><path d="M345.0 325.0L332.0 325.0" stroke="#296a79" stroke-width="4"/><text x="402.0" y="332.0" font-family="Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#1b4d61">W</text><text x="342.0" y="330.0" font-family="Arial,sans-serif" font-size="15" font-weight="800" text-anc