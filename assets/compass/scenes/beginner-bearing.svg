<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Boat heading east with a lighthouse northeast</title><desc id="desc">Overhead boat heading 090 degrees east, with a separate 045 degree bearing toward a lighthouse northeast of the boat</desc><defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#5e9cae"/><stop offset="1" stop-color="#164966"/></linearGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffdf2"/><stop offset="1" stop-color="#e9eadc"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter><pattern id="waves" width="72" height="28" patternUnits="userSpaceOnUse"><path d="M0 14Q18 5 36 14T72 14" fill="none" stroke="#cae9e8" stroke-opacity=".25" stroke-width="2"/></pattern></defs><rect width="1000" height="550" fill="url(#sea)"/><rect width="1000" height="550" fill="url(#waves)"/><path d="M750 0Q698 92 753 170T782 349L1000 404V0Z" fill="#b7ad8c" stroke="#e4ddc1" stroke-width="10"/><path d="M763 0Q731 75 785 148T817 299" fill="none" stroke="#eee2bb" stroke-width="7"/><path d="M408 405L732 83" stroke="#f5c774" stroke-width="7" stroke-dasharray="15 10"/><circle cx="732" cy="83" r="18" fill="#ffebba" stroke="#bd5b3c" stroke-width="7"/><path d="M732 69V18M713 51H751" stroke="#f7eee0" stroke-width="8"/><path d="M410 407L670 407" stroke="#f09a6d" stroke-width="8"/><path d="M651 393L679 407L651 421" fill="none" stroke="#f09a6d" stroke-width="7"/><g transform="translate(410 405) rotate(90)" filter="url(#shadow)"><path d="M0 -99C37 -65 43 -3 39 67L20 91H-20L-39 67C-43 -3 -37 -65 0 -99Z" fill="#f8f5e8" stroke="#183e50" stroke-width="5"/><path d="M0 -53L25 -21L20 37H-20L-25 -21Z" fill="#73a0af" stroke="#2d606e" stroke-width="4"/></g><rect x="43" y="45" width="484" height="104" rx="16" fill="#0b3549" fill-opacity=".93"/><text x="68" y="87" font-family="Arial,sans-serif" font-size="29" font-weight="800" text-anchor="start" fill="#fff">HEADING IS NOT BEARING</text><text x="68" y="124" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#bfe6e7">The boat and the object have different directions.</text><rect x="582" y="168" width="339" height="90" rx="14" fill="#fff9e9" filter="url(#shadow)"/><rect x="582" y="294" width="339" height="90" rx="14" fill="#fff9e9" filter="url(#shadow)"/><text x="607" y="202" font-family="Arial,sans-serif" font-size="18" font-weight="800" text-anchor="start" fill="#8c673c">BEARING TO LIGHTHOUSE</text><text x="607" y="240" font-family="Arial,sans-serif" font-size="34" font-weight="800" text-anchor="start" fill="#9f603c">045° C</text><text x="607" y="328" font-family="Arial,sans-serif" font-size="18" font-weight="800" text-anchor="start" fill="#8c673c">BOW / HEADING</text><text x="607" y="367" font-family="Arial,sans-serif" font-size="34" font-weight="800" text-anchor="start" fill="#b15e3b">090° C</text><text x="410" y="480" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#fff">The line of sight goes northeast; the bow points east.</text></svg>