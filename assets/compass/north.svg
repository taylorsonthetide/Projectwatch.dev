<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">02  WHICH NORTH?</title><desc id="desc">True north is the chart reference; magnetic north differs.</desc><rect width="1000" height="550" fill="#eaf4f6"/><rect x="24" y="22" width="952" height="506" rx="24" fill="#fafdfe" stroke="#b9d7de" stroke-width="2"/><text x="54" y="72" fill="#173b50" font-size="35" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">02  WHICH NORTH?</text><text x="54" y="104" fill="#527986" font-size="17" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">True north is the chart reference; magnetic north differs.</text><line x1="290" y1="416" x2="290" y2="158" stroke="#123d60" stroke-width="8" stroke-linecap="round" /><line x1="290" y1="416" x2="290" y2="158" stroke="#123d60" stroke-width="8" stroke-linecap="round" /><path d="M290 158 l-12 22 m12 -22 l12 22" transform="rotate(0.0 290 158)" fill="none" stroke="#123d60" stroke-width="8" stroke-linecap="round"/><line x1="290" y1="416" x2="395" y2="180" stroke="#df754e" stroke-width="8" stroke-linecap="round" /><path d="M395 180 l-12 22 m12 -22 l12 22" transform="rotate(24.0 395 180)" fill="none" stroke="#df754e" stroke-width="8" stroke-linecap="round"/><text x="180" y="144" fill="#123d60" font-size="24" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">TRUE NORTH</text><text x="394" y="169" fill="#bc633d" font-size="23" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">MAGNETIC NORTH</text><rect x="572" y="159" width="332" height="240" rx="18" fill="#fff" stroke="#b9d6dc" stroke-width="2"/><text x="601" y="210" fill="#173b50" font-size="30" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">VARIATION</text><text x="601" y="255" fill="#527986" font-size="23" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Angle between</text><text x="601" y="290" fill="#527986" font-size="23" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">true and magnetic</text><text x="601" y="352" fill="#527986" font-size="18" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">Changes by place and time</text><rect x="54" y="486" width="892" height="24" rx="8" fill="#e2f0f2"/><text x="68" y="503" fill="#477683" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">SCHEMATIC • FICTIONAL DIRECTIONS • NOT FOR NAVIGATION</text></svg>