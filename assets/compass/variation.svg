<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">03  VARIATION</title><desc id="desc">Magnetic → true; east adds and west subtracts.</desc><rect width="1000" height="550" fill="#eaf4f6"/><rect x="24" y="22" width="952" height="506" rx="24" fill="#fafdfe" stroke="#b9d7de" stroke-width="2"/><text x="54" y="72" fill="#173b50" font-size="35" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">03  VARIATION</text><text x="54" y="104" fill="#527986" font-size="17" font-weight="500" text-anchor="start" font-family="Arial, sans-serif">Magnetic → true; east adds and west subtracts.</text><rect x="72" y="166" width="385" height="259" rx="18" fill="#fff" stroke="#b9d6dc" stroke-width="2"/><text x="102" y="213" fill="#173b50" font-size="25" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">EAST EXAMPLE</text><text x="102" y="266" fill="#24768b" font-size="30" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">084° M + 3° E</text><text x="102" y="317" fill="#17624f" font-size="36" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">= 087° T</text><text x="102" y="380" fill="#527986" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">East is positive</text><rect x="541" y="166" width="385" height="259" rx="18" fill="#fff" stroke="#b9d6dc" stroke-width="2"/><text x="571" y="213" fill="#173b50" font-size="25" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">WEST EXAMPLE</text><text x="571" y="266" fill="#24768b" font-size="30" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">084° M − 4° W</text><text x="571" y="317" fill="#17624f" font-size="36" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">= 080° T</text><text x="571" y="380" fill="#527986" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">West is negative</text><rect x="54" y="486" width="892" height="24" rx="8" fill="#e2f0f2"/><text x="68" y="503" fill="#477683" font-size="13" font-weight="700" text-anchor="start" font-family="Arial, sans-serif">SCHEMATIC • FICTIONAL DIRECTIONS • NOT FOR NAVIGATION</text></svg>