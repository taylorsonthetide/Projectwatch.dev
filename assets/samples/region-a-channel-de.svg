<title id="title">Betonnungsgrundlagen: IALA-Region A | Kostenlose Helmlore-Lektion</title><desc id="desc">Ein Boot fährt nach oben in Betonnungsrichtung. Die rote Tonne mit Zylinder-Toppzeichen bleibt links an Backbord, die grüne Tonne mit Kegel-Toppzeichen rechts an Steuerbord.</desc>
