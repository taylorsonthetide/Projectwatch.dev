<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" role="img" aria-labelledby="title desc"><title id="title">IALA Region A: travelling with the direction of buoyage</title><desc id="desc">The boat points upwards in the conventional direction of buoyage. The red pillar buoy with a can topmark is on its port side, left. The green pillar buoy with an upward-pointing cone topmark is on its starboard side, right.</desc><rect width="800" height="510" rx="18" fill="#edf5f8"/><g font-family="sans-serif" fill="#173044"><text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700">WITH THE DIRECTION OF BUOYAGE</text><path d="M400 278V90m-17 24L400 90l17 24" stroke="#173044" stroke-width="6" fill="none"/><text x="400" y="72" text-anchor="middle" font-size="16">Conventional direction</text><text x="180" y="290" text-anchor="middle" font-size="21" font-weight="700">RED · PORT</text><text x="180" y="320" text-anchor="middle" font-size="17">Leave on your left</text><text x="620" y="290" text-anchor="middle" font-size="21" font-weight="700">GREEN · STARBOARD</text><text x="620" y="320" text-anchor="middle" font-size="17">Leave on your right</text><g transform="translate(400 375)"><path d="M-29 53V-14Q-24 -47 0 -68Q24 -47 29 -14V53Z" fill="white" stroke="#173044" stroke-width="4"/><rect x="-18" y="-18" width="36" height="50" rx="5" fill="#173044"/><path d="M-13 -30L0 -45L13 -30" fill="none" stroke="#087f89" stroke-width="3"/></g><text x="400" y="470" text-anchor="middle" font-size="17">Boat’s bow points along the arrow</text></g><svg x="115" y="95" width="130" height="170" viewBox="0 0 130 170">
   <line x1="65" y1="51" x2="65" y2="64" stroke="#222" stroke-width="3"/>
   <g class="dayTop"><rect x="55" y="34" width="20" height="15" fill="#e33232"/></g><g class="dayBody"><rect x="43" y="64" width="44" height="78" rx="7" fill="#e33232"/></g>
   <ellipse class="waterShadow" cx="65" cy="145" rx="31" ry="7" fill="#072b3d" opacity=".55"/><circle class="buoyLamp" data-lamp="red" cx="65" cy="57" r="6" fill="#fff"/>
  </svg><svg x="555" y="95" width="130" height="170" viewBox="0 0 130 170">
   <line x1="65" y1="51" x2="65" y2="64" stroke="#222" stroke-width="3"/>
   <g class="dayTop"><polygon points="65,29 53,50 77,50" fill="#16a34a"/></g><g class="dayBody"><rect x="43" y="64" width="44" height="78" rx="7" fill="#16a34a"/></g>
   <ellipse class="waterShadow" cx="65" cy="145" rx="31" ry="7" fill="#072b3d" opacity=".55"/><circle class="buoyLamp" data-lamp="green" cx="65" cy="57" r="6" fill="#fff"/>
  </svg></svg>