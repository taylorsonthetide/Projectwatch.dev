<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#06151d;color:#eaf5f8;font-family:Arial,Helvetica,sans-serif}
header{padding:26px 22px;background:#082430;border-bottom:1px solid #1f5365}header h1{margin:0;font-size:26px}header p{max-width:1000px;line-height:1.5;color:#b9ced5}
.badge{display:inline-block;background:#0c3b4b;border:1px solid #2b7188;border-radius:999px;padding:7px 11px;margin:4px;font-size:12px;font-weight:700}
.controls{padding:14px 22px;display:flex;gap:8px;flex-wrap:wrap}button{background:#0b3342;color:#fff;border:1px solid #28687e;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;padding:0 22px 30px}
.card{background:#0a2632;border:1px solid #1d5264;border-radius:15px;overflow:hidden;box-shadow:0 8px 22px #0005}
.meta{display:flex;justify-content:space-between;padding:9px 12px;font-size:11px;font-weight:800;color:#8fd9ee;background:#071d26}
.night{height:250px;background:#000;position:relative;border-top:1px solid #173947;border-bottom:1px solid #173947}
.lamp{position:absolute;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;z-index:2}
.white{background:#fff;box-shadow:0 0 8px 3px #fff,0 0 22px 8px #dff7ff99}
.red{background:#ff3030;box-shadow:0 0 8px 3px #ff3030,0 0 22px 8px #ff303077}
.green{background:#31ed75;box-shadow:0 0 8px 3px #31ed75,0 0 22px 8px #31ed7577}
.yellow{background:#ffd633;box-shadow:0 0 8px 3px #ffd633,0 0 22px 8px #ffd63377}
.flashRing{position:absolute;inset:-10px;border:2px dashed currentColor;border-radius:50%;opacity:.8}
.yellow .flashRing{color:#ffd633}.red .flashRing{color:#ff3030}
.card h2{font-size:17px;margin:13px 14px 5px}.subtitle{margin:0 14px;color:#8ed6ea;font-weight:700;font-size:13px}.card p{margin:10px 14px 16px;color:#c8d9df;line-height:1.45;font-size:13px}
.conditional,.arc{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.05em;color:#9eb4bc;white-space:nowrap}
.notice{margin:0 22px 18px;padding:14px;border:1px solid #5b7b36;background:#172b16;border-radius:12px;line-height:1.5}
footer{padding:20px 22px;color:#8ba5af;font-size:12px;border-top:1px solid #173947}
@media(max-width:600px){main{padding:0 10px 20px}header,.controls{padding-left:12px;padding-right:12px}.notice{margin-left:12px;margin-right:12px}}

.sectionTitle{grid-column:1/-1;background:#082430;border:1px solid #28687e;border-radius:14px;padding:15px 17px;margin-top:8px}
.sectionTitle h2{margin:0 0 5px;font-size:20px}.sectionTitle p{margin:0;color:#b9ced5;font-size:13px}
.day{height:250px;background:#f7f7f2;position:relative;border-top:1px solid #d4d4ce;border-bottom:1px solid #d4d4ce}
.shape{position:absolute;transform:translate(-50%,-50%);background:#000}
.ball{width:34px;height:34px;border-radius:50%}
.diamond{width:34px;height:34px;transform:translate(-50%,-50%) rotate(45deg)}
.cylinder{width:32px;height:64px}
.coneUp{width:0;height:0;background:transparent;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:44px solid #000}
.coneDown{width:0;height:0;background:transparent;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid #000}
.flagA{width:76px;height:56px;background:linear-gradient(90deg,#fff 0 50%,#1565c0 50%);border:2px solid #111}
.kindtag{position:absolute;right:10px;bottom:8px;font-size:10px;font-weight:800;color:#777}
.smallnote{font-size:11px;color:#91aab3}

body{background:#06151d;padding:10px}
main{padding:0;display:block}
.card{min-width:0;border:0;box-shadow:none;background:#06151d}
.night,.day{height:260px;border-radius:12px;border:1px solid #ffffff18}
header,.controls,.notice,footer,.sectionTitle,.meta,.card h2,.subtitle,.card p,.conditional,.arc,.kindtag{display:none!important}
</style></head><body><main><article class="card" data-rule="27(b)">
<div class="meta"><span>PW-R27-RAM</span><span>RULE 27(b)</span></div><div class="night"><span class="lamp red" style="left:50%;top:27%"></span><span class="lamp white" style="left:50%;top:50%"></span><span class="lamp red" style="left:50%;top:73%"></span></div>
<h2>Restricted ability to manoeuvre — not making way</h2><div class="subtitle">Red-white-red</div>
<p>Three all-round lights vertical.</p></article></main></body></html>
