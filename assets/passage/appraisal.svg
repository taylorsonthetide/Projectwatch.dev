<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860"><rect width="1440" height="860" fill="#f4f1e7"/><g font-family="Arial,Helvetica,sans-serif" fill="#173d4b"><text x="70" y="58" font-size="15" letter-spacing="3">HELMLORE • PASSAGE PLANNING</text><text x="70" y="115" font-size="36" font-weight="700">Make the trip fit the boat and crew</text><text x="70" y="155" font-size="21" fill="#56717a">Four questions to resolve before committing to a departure.</text><rect x="70" y="220" width="620" height="225" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="98" y="266" font-size="26" fill="#173d4b">THE BOAT</text><text x="98" y="312" font-size="21" fill="#173d4b">Seaworthy • suitable equipment</text><text x="98" y="350" font-size="21" fill="#173d4b">Draught • fuel • range • power</text><rect x="750" y="220" width="620" height="225" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="778" y="266" font-size="26" fill="#173d4b">THE PEOPLE</text><text x="778" y="312" font-size="21" fill="#173d4b">Experience • rest • confidence</text><text x="778" y="350" font-size="21" fill="#173d4b">Clothing • health • shared roles</text><rect x="70" y="485" width="620" height="225" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="98" y="531" font-size="26" fill="#173d4b">THE CONDITIONS</text><text x="98" y="577" font-size="21" fill="#173d4b">Wind • waves • visibility • trend</text><text x="98" y="615" font-size="21" fill="#173d4b">Tide • daylight • safe access</text><rect x="750" y="485" width="620" height="225" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="778" y="531" font-size="26" fill="#173d4b">THE OPTIONS</text><text x="778" y="577" font-size="21" fill="#173d4b">Suitable destination and alternative</text><text x="778" y="615" font-size="21" fill="#173d4b">Delay • shorten • return • divert</text><path d="M70 788H1370" stroke="#b4c3bd"/><text x="70" y="824" font-size="16">ORIGINAL TEACHING VISUAL • FICTIONAL EXAMPLES • NOT FOR NAVIGATION</text></g></svg>