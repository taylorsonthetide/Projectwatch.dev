<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860"><rect width="1440" height="860" fill="#f4f1e7"/><g font-family="Arial,Helvetica,sans-serif" fill="#173d4b"><text x="70" y="58" font-size="15" letter-spacing="3">PROJECT WATCH • PASSAGE PLANNING</text><text x="70" y="115" font-size="36" font-weight="700">Turn distance into a realistic ETA</text><text x="70" y="155" font-size="21" fill="#56717a">Teaching example: constant 5 kn speed over ground; one stated time basis.</text><rect x="70" y="220" width="395" height="225" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="98" y="266" font-size="26" fill="#173d4b">LEG 1 • 6 NM</text><text x="98" y="312" font-size="21" fill="#173d4b">6 ÷ 5 = 1.2 hours</text><text x="98" y="350" font-size="21" fill="#173d4b">72 minutes</text><rect x="520" y="220" width="395" height="225" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="548" y="266" font-size="26" fill="#173d4b">LEG 2 • 4 NM</text><text x="548" y="312" font-size="21" fill="#173d4b">4 ÷ 5 = 0.8 hours</text><text x="548" y="350" font-size="21" fill="#173d4b">48 minutes</text><rect x="970" y="220" width="400" height="225" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="998" y="266" font-size="26" fill="#173d4b">OTHER TIME</text><text x="998" y="312" font-size="21" fill="#173d4b">Manoeuvres and waiting</text><text x="998" y="350" font-size="21" fill="#173d4b">30 minutes</text><rect x="70" y="500" width="1300" height="185" rx="18" fill="#173d4b"/><text x="105" y="553" font-size="30" fill="#fff">09:00 departure  +  2 h 30 min  =  11:30 estimated arrival</text><text x="105" y="610" font-size="24" fill="#d5eeea">Recheck tide, daylight and weather if progress is slower.</text><text x="105" y="652" font-size="21" fill="#d5eeea">An ETA is an estimate to update.</text><path d="M70 788H1370" stroke="#b4c3bd"/><text x="70" y="824" font-size="16">ORIGINAL TEACHING VISUAL • FICTIONAL EXAMPLES • NOT FOR NAVIGATION</text></g></svg>