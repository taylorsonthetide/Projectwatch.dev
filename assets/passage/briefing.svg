<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860"><rect width="1440" height="860" fill="#f4f1e7"/><g font-family="Arial,Helvetica,sans-serif" fill="#173d4b"><text x="70" y="58" font-size="15" letter-spacing="3">PROJECT WATCH • PASSAGE PLANNING</text><text x="70" y="115" font-size="36" font-weight="700">Make the plan a shared plan</text><text x="70" y="155" font-size="21" fill="#56717a">The crew and a responsible person ashore need different useful information.</text><rect x="70" y="220" width="620" height="450" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="98" y="266" font-size="26" fill="#173d4b">ON BOARD</text><text x="98" y="312" font-size="21" fill="#173d4b">Where we are going and likely conditions</text><text x="98" y="350" font-size="21" fill="#173d4b">Crew roles and who can take over</text><text x="98" y="388" font-size="21" fill="#173d4b">Lifejackets and safety equipment</text><text x="98" y="426" font-size="21" fill="#173d4b">How to call for help and give position</text><text x="98" y="464" font-size="21" fill="#173d4b">What would make us change the plan</text><rect x="750" y="220" width="620" height="450" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="778" y="266" font-size="26" fill="#173d4b">ASHORE</text><text x="778" y="312" font-size="21" fill="#173d4b">Boat identity and people aboard</text><text x="778" y="350" font-size="21" fill="#173d4b">Route and expected arrival or return</text><text x="778" y="388" font-size="21" fill="#173d4b">Contact details and alternative plans</text><text x="778" y="426" font-size="21" fill="#173d4b">What to do if concerned</text><text x="778" y="464" font-size="21" fill="#173d4b">Update changes; confirm safe arrival</text><path d="M70 788H1370" stroke="#b4c3bd"/><text x="70" y="824" font-size="16">ORIGINAL TEACHING VISUAL • FICTIONAL EXAMPLES • NOT FOR NAVIGATION</text></g></svg>