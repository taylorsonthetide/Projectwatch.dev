<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860"><rect width="1440" height="860" fill="#f4f1e7"/><g font-family="Arial,Helvetica,sans-serif" fill="#173d4b"><text x="70" y="58" font-size="15" letter-spacing="3">HELMLORE • PASSAGE PLANNING</text><text x="70" y="115" font-size="36" font-weight="700">Record reality, not just your intentions</text><text x="70" y="155" font-size="21" fill="#56717a">An original example navigation log. Never let logging interrupt lookout.</text><rect x="70" y="220" width="1300" height="490" rx="15" fill="#fff" stroke="#a3b9b9"/><text x="100" y="263" font-size="18" fill="#173d4b">TIME UTC</text><text x="290" y="263" font-size="18" fill="#173d4b">ENTRY TYPE</text><text x="610" y="263" font-size="18" fill="#173d4b">OBSERVATION / ACTION</text><path d="M90 285H1350" stroke="#d4dfdb"/><text x="100" y="315" font-size="24" fill="#173d4b">09:00</text><text x="290" y="315" font-size="23" fill="#173d4b">Departure</text><text x="610" y="315" font-size="21" fill="#173d4b">Boat and crew checks complete</text><path d="M90 363H1350" stroke="#d4dfdb"/><text x="100" y="393" font-size="24" fill="#173d4b">10:00</text><text x="290" y="393" font-size="23" fill="#173d4b">Position / progress</text><text x="610" y="393" font-size="21" fill="#173d4b">GPS cross-check; SOG lower than planned</text><path d="M90 441H1350" stroke="#d4dfdb"/><text x="100" y="471" font-size="24" fill="#173d4b">10:10</text><text x="290" y="471" font-size="23" fill="#173d4b">Decision</text><text x="610" y="471" font-size="21" fill="#173d4b">Crew unwell; choose checked alternative</text><path d="M90 519H1350" stroke="#d4dfdb"/><text x="100" y="549" font-size="24" fill="#173d4b">10:15</text><text x="290" y="549" font-size="23" fill="#173d4b">Communication</text><text x="610" y="549" font-size="21" fill="#173d4b">Crew briefed; shore contact updated</text><path d="M90 597H1350" stroke="#d4dfdb"/><text x="100" y="627" font-size="24" fill="#173d4b">11:05</text><text x="290" y="627" font-size="23" fill="#173d4b">Arrival</text><text x="610" y="627" font-size="21" fill="#173d4b">Secured; close plan; record defect</text><path d="M70 788H1370" stroke="#b4c3bd"/><text x="70" y="824" font-size="16">ORIGINAL TEACHING VISUAL • FICTIONAL EXAMPLES • NOT FOR NAVIGATION</text></g></svg>