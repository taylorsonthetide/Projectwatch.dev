<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860"><rect width="1440" height="860" fill="#f4f1e7"/><g font-family="Arial,Helvetica,sans-serif" fill="#173d4b"><text x="70" y="58" font-size="15" letter-spacing="3">HELMLORE • PASSAGE PLANNING</text><text x="70" y="115" font-size="36" font-weight="700">Depth is more than a tide time</text><text x="70" y="155" font-size="21" fill="#56717a">A fictional harbour sill, using a single chart datum.</text><rect x="80" y="215" width="780" height="390" rx="15" fill="#dceff0"/><path d="M80 605H860V710H80Z" fill="#d5c598"/><path d="M80 493.57H860" stroke="#947653" stroke-dasharray="9 9" stroke-width="3"/><text x="105" y="482" font-size="21" fill="#173d4b">Chart datum</text><path d="M170 215V493.57M158 215H182M158 493.57H182M170 493.57V605M158 605H182" stroke="#237e96" stroke-width="4"/><text x="205" y="310" font-size="24" fill="#173d4b">2.0 m tide above datum</text><text x="205" y="568" font-size="24" fill="#173d4b">0.8 m charted depth</text><path d="M455 215 L740 215 L700 310 L500 310 Z" fill="#173d4b"/><path d="M610 310V437.86" stroke="#173d4b" stroke-width="18"/><path d="M585 437.86H635" stroke="#173d4b" stroke-width="10"/><text x="635" y="400" font-size="21" fill="#173d4b">1.6 m draught</text><text x="475" y="540" font-size="23" fill="#18795c">1.2 m static clearance</text><rect x="910" y="230" width="460" height="445" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="938" y="276" font-size="26" fill="#173d4b">THE CALCULATION</text><text x="938" y="322" font-size="21" fill="#173d4b">0.8 + 2.0 = 2.8 m water</text><text x="938" y="360" font-size="21" fill="#173d4b">2.8 − 1.6 = 1.2 m clearance</text><text x="938" y="398" font-size="21" fill="#173d4b"></text><text x="938" y="436" font-size="21" fill="#173d4b">Before waves, squat and</text><text x="938" y="474" font-size="21" fill="#173d4b">other uncertainty allowances.</text><text x="938" y="512" font-size="21" fill="#173d4b"></text><text x="938" y="550" font-size="21" fill="#173d4b">Check matching datums.</text><path d="M70 788H1370" stroke="#b4c3bd"/><text x="70" y="824" font-size="16">ORIGINAL TEACHING VISUAL • FICTIONAL EXAMPLES • NOT FOR NAVIGATION</text></g></svg>