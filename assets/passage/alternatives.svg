<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860"><rect width="1440" height="860" fill="#f4f1e7"/><g font-family="Arial,Helvetica,sans-serif" fill="#173d4b"><text x="70" y="58" font-size="15" letter-spacing="3">PROJECT WATCH • PASSAGE PLANNING</text><text x="70" y="115" font-size="36" font-weight="700">Decide before the options narrow</text><text x="70" y="155" font-size="21" fill="#56717a">Example triggers: choose suitable limits for the boat, crew and location.</text><rect x="70" y="220" width="620" height="225" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="98" y="266" font-size="26" fill="#173d4b">BEFORE DEPARTURE</text><text x="98" y="312" font-size="21" fill="#173d4b">Forecast or boat not suitable?</text><text x="98" y="350" font-size="21" fill="#173d4b">Delay or select a different trip.</text><rect x="750" y="220" width="620" height="225" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="778" y="266" font-size="26" fill="#173d4b">WHILE STILL IN OPEN WATER</text><text x="778" y="312" font-size="21" fill="#173d4b">Crew illness or worsening conditions?</text><text x="778" y="350" font-size="21" fill="#173d4b">Review return or checked refuge.</text><rect x="70" y="485" width="620" height="225" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="98" y="531" font-size="26" fill="#173d4b">BEFORE A RESTRICTED APPROACH</text><text x="98" y="577" font-size="21" fill="#173d4b">Gate missed or clearance uncertain?</text><text x="98" y="615" font-size="21" fill="#173d4b">Use a checked waiting place or divert.</text><rect x="750" y="485" width="620" height="225" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="778" y="531" font-size="26" fill="#173d4b">AFTER A CHANGE</text><text x="778" y="577" font-size="21" fill="#173d4b">Recalculate • brief • record</text><text x="778" y="615" font-size="21" fill="#173d4b">Update the shore contact when safe.</text><path d="M70 788H1370" stroke="#b4c3bd"/><text x="70" y="824" font-size="16">ORIGINAL TEACHING VISUAL • FICTIONAL EXAMPLES • NOT FOR NAVIGATION</text></g></svg>