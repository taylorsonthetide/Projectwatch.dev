<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860"><rect width="1440" height="860" fill="#f4f1e7"/><g font-family="Arial,Helvetica,sans-serif" fill="#173d4b"><text x="70" y="58" font-size="15" letter-spacing="3">HELMLORE • PASSAGE PLANNING</text><text x="70" y="115" font-size="36" font-weight="700">Preserve your options with endurance</text><text x="70" y="155" font-size="21" fill="#56717a">Illustrative fuel calculation; use evidence from your own boat.</text><rect x="70" y="230" width="400" height="350" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="98" y="276" font-size="26" fill="#173d4b">EXPECTED TRIP</text><text x="98" y="322" font-size="21" fill="#173d4b">2.5 hours × 8 L/hour</text><text x="98" y="360" font-size="21" fill="#173d4b">20 L</text><text x="98" y="398" font-size="21" fill="#173d4b"></text><text x="98" y="436" font-size="21" fill="#173d4b">Includes assumed operating</text><text x="98" y="474" font-size="21" fill="#173d4b">time for this example.</text><rect x="520" y="230" width="400" height="350" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="548" y="276" font-size="26" fill="#173d4b">DIVERSION</text><text x="548" y="322" font-size="21" fill="#173d4b">1 hour × 8 L/hour</text><text x="548" y="360" font-size="21" fill="#173d4b">8 L</text><text x="548" y="398" font-size="21" fill="#173d4b"></text><text x="548" y="436" font-size="21" fill="#173d4b">Allow for a checked</text><text x="548" y="474" font-size="21" fill="#173d4b">alternative destination.</text><rect x="970" y="230" width="400" height="350" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="998" y="276" font-size="26" fill="#173d4b">CHOSEN RESERVE</text><text x="998" y="322" font-size="21" fill="#173d4b">Illustrative allowance</text><text x="998" y="360" font-size="21" fill="#173d4b">10 L</text><text x="998" y="398" font-size="21" fill="#173d4b"></text><text x="998" y="436" font-size="21" fill="#173d4b">Not a universal rule;</text><text x="998" y="474" font-size="21" fill="#173d4b">choose for the circumstances.</text><text x="90" y="675" font-size="34" fill="#167558">20 + 8 + 10 = 38 litres needed in this example</text><path d="M70 788H1370" stroke="#b4c3bd"/><text x="70" y="824" font-size="16">ORIGINAL TEACHING VISUAL • FICTIONAL EXAMPLES • NOT FOR NAVIGATION</text></g></svg>