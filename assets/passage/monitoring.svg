<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860"><rect width="1440" height="860" fill="#f4f1e7"/><g font-family="Arial,Helvetica,sans-serif" fill="#173d4b"><text x="70" y="58" font-size="15" letter-spacing="3">HELMLORE • PASSAGE PLANNING</text><text x="70" y="115" font-size="36" font-weight="700">Compare the plan with what you observe</text><text x="70" y="155" font-size="21" fill="#56717a">Use changes as reasons to reassess, not reasons to force the original plan.</text><rect x="70" y="220" width="620" height="450" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="98" y="266" font-size="26" fill="#173d4b">PLANNED</text><text x="98" y="312" font-size="21" fill="#173d4b">Expected progress and arrival window</text><text x="98" y="350" font-size="21" fill="#173d4b">Suitable forecast and crew condition</text><text x="98" y="388" font-size="21" fill="#173d4b">Fuel for route, diversion and reserve</text><text x="98" y="426" font-size="21" fill="#173d4b">Checked approach and alternative</text><rect x="750" y="220" width="620" height="450" rx="18" fill="#e5eeea" stroke="#9fb8b5"/><text x="778" y="266" font-size="26" fill="#173d4b">OBSERVED → ACTION</text><text x="778" y="312" font-size="21" fill="#173d4b">Slower speed → revised ETA and gate</text><text x="778" y="350" font-size="21" fill="#173d4b">Worsening weather → review exposure</text><text x="778" y="388" font-size="21" fill="#173d4b">Crew illness → review workload and route</text><text x="778" y="426" font-size="21" fill="#173d4b">Unsafe entry → wait safely or divert</text><path d="M70 788H1370" stroke="#b4c3bd"/><text x="70" y="824" font-size="16">ORIGINAL TEACHING VISUAL • FICTIONAL EXAMPLES • NOT FOR NAVIGATION</text></g></svg>