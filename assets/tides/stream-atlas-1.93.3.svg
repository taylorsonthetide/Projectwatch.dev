<text x="38" y="151" fill="#456573" font-size="17" font-weight="500">A stream plate uses high water at its named reference port.</text>
<rect x="38" y="180" width="884" height="275" rx="16" fill="#ffffff" stroke="#cee1e5"/><rect x="66" y="205" width="828" height="64" rx="9" fill="#d9ecee"/><text x="86" y="245" fill="#15384a" font-size="21" font-weight="800">EXAMPLE PLATE  ·  HW REFERENCE PORT − 2 HOURS</text><path d="M120 345L512 345" fill="none" stroke="#087e90" stroke-width="9"/><path d="M512 345l-13 -7v14z" fill="#087e90" transform="rotate(0.0 512 345)"/><text x="92" y="413" fill="#15384a" font-size="18" font-weight="700">Arrowhead = direction towards</text><rect x="610" y="295" width="254" height="117" rx="10" fill="#f8f0da"/><text x="631" y="328" fill="#9b6a1d" font-size="15" font-weight="800">EXAMPLE RATES</text><text x="631" y="363" fill="#15384a" font-size="20" font-weight="600">Spring 1.8 kn</text><text x="631" y="393" fill="#15384a" font-size="20" font-weight="600">Neap 0.9 kn</text>
