<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">stream-atlas.svg</title><desc id="desc">Schematic original training illustration; no real navigation data.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#062739"/><stop offset="1" stop-color="#0c5260"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" opacity=".045"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#72e1e5" stroke-width="2"/></marker></defs><rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)"/><text x="48" y="55" fill="#89e6e7" font-size="17" font-weight="700" letter-spacing="3">PROJECT WATCH • TIDES</text><text x="48" y="105" fill="#effaff" font-size="34" font-weight="600" font-family="Arial,sans-serif">Match the reference hour</text><rect x="100" y="155" width="760" height="296" rx="16" fill="#123f52" stroke="#82cfd7" stroke-width="3"/><text x="145" y="205" fill="#8ee8e6" font-size="19" font-weight="600" font-family="Arial,sans-serif">EXAMPLE ATLAS PLATE</text><text x="145" y="263" fill="#effaff" font-size="30" font-weight="600" font-family="Arial,sans-serif">HW reference port  −2 hours</text><path d="M200 338 H635" stroke="#79e5e4" stroke-width="9" marker-end="url(#arrow)"/><text x="145" y="415" fill="#effaff" font-size="22" font-weight="600" font-family="Arial,sans-serif">Arrow = set (towards)</text><text x="570" y="415" fill="#f7d890" font-size="22" font-weight="600" font-family="Arial,sans-serif">Spring / neap rates</text><text x="550" y="335" fill="#effaff" font-size="23" font-weight="600" font-family="Arial,sans-serif">1.8 kn / 0.9 kn</text><text x="48" y="510" fill="#a1cbd1" font-size="14">SCHEMATIC TRAINING DIAGRAM • NOT FOR NAVIGATION</text></svg>