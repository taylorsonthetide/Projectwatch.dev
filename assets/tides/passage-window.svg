<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">passage-window.svg</title><desc id="desc">Schematic original training illustration; no real navigation data.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#062739"/><stop offset="1" stop-color="#0c5260"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" opacity=".045"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#72e1e5" stroke-width="2"/></marker></defs><rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)"/><text x="48" y="55" fill="#89e6e7" font-size="17" font-weight="700" letter-spacing="3">PROJECT WATCH • TIDES</text><text x="48" y="105" fill="#effaff" font-size="32" font-weight="600" font-family="Arial,sans-serif">Plan height, stream and arrival together</text><path d="M100 390 H860" stroke="#d7eeee" stroke-width="4"/><path d="M210 390 V220 M475 390 V220 M750 390 V220" stroke="#a8dadc" stroke-width="3"/><text x="128" y="425" fill="#effaff" font-size="20" font-weight="600" font-family="Arial,sans-serif">DEPART</text><text x="402" y="425" fill="#effaff" font-size="20" font-weight="600" font-family="Arial,sans-serif">NARROWS</text><text x="695" y="425" fill="#effaff" font-size="20" font-weight="600" font-family="Arial,sans-serif">ARRIVE</text><path d="M120 295 C310 290 390 190 520 186 S705 250 835 270" fill="none" stroke="#78e0e7" stroke-width="8"/><rect x="395" y="330" width="230" height="38" rx="16" fill="#6dd9ad" opacity=".55"/><text x="399" y="356" fill="#fff" font-size="20" font-weight="600" font-family="Arial,sans-serif">DEPTH WINDOW</text><text x="110" y="165" fill="#effaff" font-size="23" font-weight="600" font-family="Arial,sans-serif">Check the local curve</text><text x="580" y="165" fill="#f8d78e" font-size="23" font-weight="600" font-family="Arial,sans-serif">Check stream + weather</text><text x="48" y="510" fill="#a1cbd1" font-size="14">SCHEMATIC TRAINING DIAGRAM • NOT FOR NAVIGATION</text></svg>