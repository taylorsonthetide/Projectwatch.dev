<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">set-drift.svg</title><desc id="desc">Schematic original training illustration; no real navigation data.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#062739"/><stop offset="1" stop-color="#0c5260"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" opacity=".045"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#72e1e5" stroke-width="2"/></marker></defs><rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)"/><text x="48" y="55" fill="#89e6e7" font-size="17" font-weight="700" letter-spacing="3">PROJECT WATCH • TIDES</text><text x="48" y="105" fill="#effaff" font-size="32" font-weight="600" font-family="Arial,sans-serif">Boat + water = track over ground</text><path d="M205 425 V190" stroke="#f7d890" stroke-width="7" marker-end="url(#arrow)"/><path d="M205 425 H380" stroke="#80e9e4" stroke-width="7" marker-end="url(#arrow)"/><path d="M205 425 L380 190" stroke="#fff" stroke-width="6" marker-end="url(#arrow)"/><text x="65" y="175" fill="#effaff" font-size="25" font-weight="600" font-family="Arial,sans-serif">N</text><text x="398" y="197" fill="#effaff" font-size="23" font-weight="600" font-family="Arial,sans-serif">Ground track</text><text x="240" y="454" fill="#8de9df" font-size="21" font-weight="600" font-family="Arial,sans-serif">East stream 1 kn</text><text x="65" y="313" fill="#f8d78e" font-size="20" font-weight="600" font-family="Arial,sans-serif">Boat north 4 kn</text><text x="520" y="255" fill="#effaff" font-size="27" font-weight="600" font-family="Arial,sans-serif">After 1 hour:</text><text x="520" y="315" fill="#effaff" font-size="26" font-weight="600" font-family="Arial,sans-serif">4 NM north + 1 NM east</text><text x="520" y="370" fill="#f8d78e" font-size="21" font-weight="600" font-family="Arial,sans-serif">Steer into the stream to compensate</text><text x="48" y="510" fill="#a1cbd1" font-size="14">SCHEMATIC TRAINING DIAGRAM • NOT FOR NAVIGATION</text></svg>