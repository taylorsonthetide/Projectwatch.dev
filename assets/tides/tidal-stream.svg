<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">tidal-stream.svg</title><desc id="desc">Schematic original training illustration; no real navigation data.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#062739"/><stop offset="1" stop-color="#0c5260"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" opacity=".045"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#72e1e5" stroke-width="2"/></marker></defs><rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)"/><text x="48" y="55" fill="#89e6e7" font-size="17" font-weight="700" letter-spacing="3">PROJECT WATCH • TIDES</text><text x="48" y="108" fill="#effaff" font-size="34" font-weight="600" font-family="Arial,sans-serif">Height and stream are separate</text><path d="M55 345 Q260 260 450 338 T905 330" fill="none" stroke="#71c8e9" stroke-width="20"/><path d="M205 215 H390 M455 215 H640 M695 215 H840" stroke="#81e6d4" stroke-width="9" marker-end="url(#arrow)"/><text x="60" y="188" fill="#8de6d7" font-size="20" font-weight="600" font-family="Arial,sans-serif">FLOOD / EBB</text><text x="120" y="410" fill="#effaff" font-size="24" font-weight="600" font-family="Arial,sans-serif">Stream flows towards the arrowhead</text><text x="120" y="450" fill="#f7d890" font-size="20" font-weight="600" font-family="Arial,sans-serif">Rate = speed in knots • slack may differ from HW/LW</text><text x="48" y="510" fill="#a1cbd1" font-size="14">SCHEMATIC TRAINING DIAGRAM • NOT FOR NAVIGATION</text></svg>