<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">chart-datum.svg</title><desc id="desc">Schematic original training illustration; no real navigation data.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#062739"/><stop offset="1" stop-color="#0c5260"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" opacity=".045"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#72e1e5" stroke-width="2"/></marker></defs><rect width="960" height="540" fill="url(#bg)"/><rect width="960" height="540" fill="url(#grid)"/><text x="48" y="55" fill="#89e6e7" font-size="17" font-weight="700" letter-spacing="3">PROJECT WATCH • TIDES</text><text x="48" y="110" fill="#effaff" font-size="33" font-weight="600" font-family="Arial,sans-serif">Sounding + tide = approximate depth</text><path d="M75 390 Q380 386 885 392 L885 475 L75 475Z" fill="#bba57c"/><path d="M75 228 Q370 214 885 228 L885 390 Q380 386 75 390Z" fill="#267ba0" opacity=".82"/><path d="M75 390 H885" stroke="#f8d78e" stroke-width="4" stroke-dasharray="12 8"/><text x="95" y="422" fill="#f8d78e" font-size="19" font-weight="600" font-family="Arial,sans-serif">CHART DATUM</text><path d="M655 380 L655 240 M640 380 H670 M640 240 H670" stroke="#fff" stroke-width="4"/><text x="680" y="311" fill="#effaff" font-size="22" font-weight="600" font-family="Arial,sans-serif">charted 2.0 m + tide 1.5 m</text><path d="M260 200 L420 200 L390 270 L290 270Z" fill="#f1f1e1"/><path d="M340 270 V355" stroke="#f1f1e1" stroke-width="5"/><text x="95" y="180" fill="#8ce8ed" font-size="19" font-weight="600" font-family="Arial,sans-serif">WATER LEVEL</text><text x="95" y="470" fill="#f8d78e" font-size="22" font-weight="600" font-family="Arial,sans-serif">Use draught + margin for clearance</text><text x="48" y="510" fill="#a1cbd1" font-size="14">SCHEMATIC TRAINING DIAGRAM • NOT FOR NAVIGATION</text></svg>