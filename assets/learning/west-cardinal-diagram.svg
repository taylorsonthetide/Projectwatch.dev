<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">West cardinal mark: colour bands and topmark</title><desc id="desc">Yellow above and below a black middle band. Two black cones point towards each other with a gap between their tips.</desc><rect width="900" height="560" fill="#eaf2f0"/><path d="M0 460 Q120 445 240 460 T480 460 T720 460 T960 460V560H0" fill="#b5d4d5"/><g stroke="#162b33" stroke-width="3"><path d="M430 165V100H450V165" fill="#f2c643"/><path d="M403 25H477L440 88Z" fill="#16212a"/><path d="M440 102L477 165H403Z" fill="#16212a"/><path d="M390 200H490V460H390Z" fill="#f2c643"/><path d="M390 285H490V375H390Z" fill="#16212a"/><path d="M380 440H500V470H380Z" fill="#f2c643"/></g><g fill="#163744" font-family="system-ui,sans-serif" font-size="23"><text x="50" y="95">Points face together</text><path d="M300 94H390" stroke="#537b85" stroke-width="2"/><text x="550" y="250">YELLOW</text><text x="550" y="340">BLACK</text><text x="550" y="420">YELLOW</text><path d="M495 240H530M495 330H530M495 410H530" stroke="#537b85" stroke-width="2"/><text x="50" y="340" font-weight="700">WEST</text><text x="50" y="375" font-size="19">Think: points at the waist</text></g></svg>