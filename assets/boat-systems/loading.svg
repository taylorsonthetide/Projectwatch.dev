<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Weight has a position</title><desc id="desc">High loads, uneven crew and free water all change the risk. Original schematic teaching illustration, not a boat-specific design.</desc><rect width="960" height="540" fill="#edf5f5"/><rect width="960" height="125" fill="#092e42"/><text x="38" y="39" font-size="14" fill="#91e0db" font-weight="700">PROJECT WATCH  /  BOAT SYSTEMS &amp; STABILITY</text><text x="38" y="86" font-size="31" fill="#fff" font-weight="700">Weight has a position</text><text x="38" y="153" font-size="17" fill="#496b78" font-weight="500">High loads, uneven crew and free water all change the risk.</text><rect x="55" y="182" width="850" height="279" rx="17" fill="#fff" stroke="#cadee2"/><rect x="78" y="390" width="805" height="54" rx="5" fill="#b9e7e9"/><path d="M138 343Q330 387 521 343L488 403Q329 443 172 403Z" fill="#217b96" stroke="#0b4b63" stroke-width="4"/><rect x="243" y="264" width="86" height="47" rx="5" fill="#d39b43"/><path d="M285 263V231" fill="none" stroke="#b06f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="555" y="245" font-size="20" fill="#173c4b" font-weight="600">High gear raises weight</text><rect x="199" y="350" width="81" height="38" rx="5" fill="#85c7b2"/><text x="555" y="333" font-size="20" fill="#173c4b" font-weight="600">Low stores: secure</text><path d="M230 400Q315 386 410 402" fill="none" stroke="#e8b65a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="555" y="421" font-size="20" fill="#173c4b" font-weight="600">Free water shifts</text><path d="M38 493H922" fill="none" stroke="#cadee2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="518" font-size="13" fill="#496b78" font-weight="700">SCHEMATIC • CHECK YOUR OWN BOAT MANUAL</text></svg>