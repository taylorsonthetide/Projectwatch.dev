<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Follow the fuel path</title><desc id="desc">Supply, filtration, return and reserve are boat-specific. Original schematic teaching illustration, not a boat-specific design.</desc><rect width="960" height="540" fill="#edf5f5"/><rect width="960" height="125" fill="#092e42"/><text x="38" y="39" font-size="14" fill="#91e0db" font-weight="700">PROJECT WATCH  /  BOAT SYSTEMS &amp; STABILITY</text><text x="38" y="86" font-size="31" fill="#fff" font-weight="700">Follow the fuel path</text><text x="38" y="153" font-size="17" fill="#496b78" font-weight="500">Supply, filtration, return and reserve are boat-specific.</text><rect x="55" y="182" width="850" height="279" rx="17" fill="#fff" stroke="#cadee2"/><rect x="85" y="260" width="188" height="110" rx="5" fill="#f4e3c0"/><rect x="385" y="260" width="188" height="110" rx="5" fill="#f4e3c0"/><rect x="685" y="260" width="188" height="110" rx="5" fill="#f4e3c0"/><text x="129" y="318" font-size="23" fill="#173c4b" font-weight="600">TANK</text><text x="415" y="318" font-size="23" fill="#173c4b" font-weight="600">FILTER</text><text x="717" y="318" font-size="23" fill="#173c4b" font-weight="600">ENGINE</text><path d="M273 313H370M573 313H670" fill="none" stroke="#b77d2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="422" font-size="17" fill="#173c4b" font-weight="600">Check contamination and valves; plan a reserve for delays and diversion.</text><path d="M38 493H922" fill="none" stroke="#cadee2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="518" font-size="13" fill="#496b78" font-weight="700">SCHEMATIC • CHECK YOUR OWN BOAT MANUAL</text></svg>