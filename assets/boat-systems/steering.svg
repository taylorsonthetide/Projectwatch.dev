<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Trace steering to the rudder</title><desc id="desc">Check response and know whether a real backup is fitted. Original schematic teaching illustration, not a boat-specific design.</desc><rect width="960" height="540" fill="#edf5f5"/><rect width="960" height="125" fill="#092e42"/><text x="38" y="39" font-size="14" fill="#91e0db" font-weight="700">PROJECT WATCH  /  BOAT SYSTEMS &amp; STABILITY</text><text x="38" y="86" font-size="31" fill="#fff" font-weight="700">Trace steering to the rudder</text><text x="38" y="153" font-size="17" fill="#496b78" font-weight="500">Check response and know whether a real backup is fitted.</text><rect x="55" y="182" width="850" height="279" rx="17" fill="#fff" stroke="#cadee2"/><rect x="80" y="252" width="185" height="115" rx="5" fill="#dce9ee"/><rect x="385" y="252" width="185" height="115" rx="5" fill="#dce9ee"/><rect x="690" y="252" width="185" height="115" rx="5" fill="#dce9ee"/><text x="135" y="310" font-size="22" fill="#173c4b" font-weight="600">HELM</text><text x="417" y="310" font-size="22" fill="#173c4b" font-weight="600">LINKAGE</text><text x="727" y="310" font-size="22" fill="#173c4b" font-weight="600">RUDDER</text><path d="M265 310H370M570 310H675" fill="none" stroke="#087e90" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="425" font-size="17" fill="#173c4b" font-weight="600">Mechanical, hydraulic or electronic: learn the path on your boat.</text><path d="M38 493H922" fill="none" stroke="#cadee2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="518" font-size="13" fill="#496b78" font-weight="700">SCHEMATIC • CHECK YOUR OWN BOAT MANUAL</text></svg>