<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Propulsion and cooling</title><desc id="desc">Watch the normal flow and notice a change. Original schematic teaching illustration, not a boat-specific design.</desc><rect width="960" height="540" fill="#edf5f5"/><rect width="960" height="125" fill="#092e42"/><text x="38" y="39" font-size="14" fill="#91e0db" font-weight="700">PROJECT WATCH  /  BOAT SYSTEMS &amp; STABILITY</text><text x="38" y="86" font-size="31" fill="#fff" font-weight="700">Propulsion and cooling</text><text x="38" y="153" font-size="17" fill="#496b78" font-weight="500">Watch the normal flow and notice a change.</text><rect x="55" y="182" width="850" height="279" rx="17" fill="#fff" stroke="#cadee2"/><rect x="95" y="265" width="180" height="96" rx="5" fill="#d7e8e6"/><rect x="409" y="265" width="180" height="96" rx="5" fill="#d7e8e6"/><rect x="723" y="265" width="140" height="96" rx="5" fill="#d7e8e6"/><text x="126" y="320" font-size="21" fill="#173c4b" font-weight="600">INTAKE</text><text x="447" y="320" font-size="21" fill="#173c4b" font-weight="600">ENGINE</text><text x="754" y="320" font-size="20" fill="#173c4b" font-weight="600">EXHAUST</text><path d="M275 312H395M590 312H708" fill="none" stroke="#087e90" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="422" font-size="17" fill="#173c4b" font-weight="600">Check oil, coolant and leaks cold; monitor alarms and exhaust underway.</text><path d="M38 493H922" fill="none" stroke="#cadee2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="518" font-size="13" fill="#496b78" font-weight="700">SCHEMATIC • CHECK YOUR OWN BOAT MANUAL</text></svg>