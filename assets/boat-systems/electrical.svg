<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Know the supply and isolation</title><desc id="desc">An electrical fault needs protection, not a larger fuse. Original schematic teaching illustration, not a boat-specific design.</desc><rect width="960" height="540" fill="#edf5f5"/><rect width="960" height="125" fill="#092e42"/><text x="38" y="39" font-size="14" fill="#91e0db" font-weight="700">HELMLORE  /  BOAT SYSTEMS &amp; STABILITY</text><text x="38" y="86" font-size="31" fill="#fff" font-weight="700">Know the supply and isolation</text><text x="38" y="153" font-size="17" fill="#496b78" font-weight="500">An electrical fault needs protection, not a larger fuse.</text><rect x="55" y="182" width="850" height="279" rx="17" fill="#fff" stroke="#cadee2"/><rect x="87" y="254" width="179" height="113" rx="5" fill="#dce9ee"/><rect x="391" y="254" width="179" height="113" rx="5" fill="#dce9ee"/><rect x="696" y="254" width="179" height="113" rx="5" fill="#dce9ee"/><text x="109" y="312" font-size="22" fill="#173c4b" font-weight="600">SOURCE</text><text x="407" y="312" font-size="19" fill="#173c4b" font-weight="600">PROTECTION</text><text x="740" y="312" font-size="22" fill="#173c4b" font-weight="600">LOAD</text><path d="M267 310H375M570 310H681" fill="none" stroke="#087e90" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="423" font-size="17" fill="#173c4b" font-weight="600">Start / house batteries • charger • distribution • essential circuits</text><path d="M38 493H922" fill="none" stroke="#cadee2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="518" font-size="13" fill="#496b78" font-weight="700">SCHEMATIC • CHECK YOUR OWN BOAT MANUAL</text></svg>