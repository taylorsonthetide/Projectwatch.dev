<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Buoyancy and righting</title><desc id="desc">Floating and recovering from heel are different questions. Original schematic teaching illustration, not a boat-specific design.</desc><rect width="960" height="540" fill="#edf5f5"/><rect width="960" height="125" fill="#092e42"/><text x="38" y="39" font-size="14" fill="#91e0db" font-weight="700">HELMLORE  /  BOAT SYSTEMS &amp; STABILITY</text><text x="38" y="86" font-size="31" fill="#fff" font-weight="700">Buoyancy and righting</text><text x="38" y="153" font-size="17" fill="#496b78" font-weight="500">Floating and recovering from heel are different questions.</text><rect x="55" y="182" width="850" height="279" rx="17" fill="#fff" stroke="#cadee2"/><rect x="78" y="390" width="805" height="54" rx="5" fill="#b9e7e9"/><path d="M138 343Q330 387 521 343L488 403Q329 443 172 403Z" fill="#217b96" stroke="#0b4b63" stroke-width="4"/><path d="M330 339V228" fill="none" stroke="#d59a3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="315" y="214" width="30" height="26" rx="5" fill="#d59a3b"/><text x="95" y="236" font-size="18" fill="#173c4b" font-weight="600">LOAD</text><text x="603" y="253" font-size="21" fill="#173c4b" font-weight="600">Hull displaces water</text><text x="603" y="291" font-size="19" fill="#173c4b" font-weight="600">Loading changes draught</text><text x="603" y="329" font-size="19" fill="#173c4b" font-weight="600">Righting depends on the boat</text><text x="603" y="430" font-size="16" fill="#173c4b" font-weight="600">No safe heel angle is implied.</text><path d="M38 493H922" fill="none" stroke="#cadee2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="518" font-size="13" fill="#496b78" font-weight="700">SCHEMATIC • CHECK YOUR OWN BOAT MANUAL</text></svg>