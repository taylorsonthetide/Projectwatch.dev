<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Notice • stabilise • decide</title><desc id="desc">Protect people and sea room before detailed troubleshooting. Original schematic teaching illustration, not a boat-specific design.</desc><rect width="960" height="540" fill="#edf5f5"/><rect width="960" height="125" fill="#092e42"/><text x="38" y="39" font-size="14" fill="#91e0db" font-weight="700">HELMLORE  /  BOAT SYSTEMS &amp; STABILITY</text><text x="38" y="86" font-size="31" fill="#fff" font-weight="700">Notice • stabilise • decide</text><text x="38" y="153" font-size="17" fill="#496b78" font-weight="500">Protect people and sea room before detailed troubleshooting.</text><rect x="55" y="182" width="850" height="279" rx="17" fill="#fff" stroke="#cadee2"/><rect x="80" y="254" width="240" height="119" rx="5" fill="#dce9ee"/><rect x="360" y="254" width="240" height="119" rx="5" fill="#dce9ee"/><rect x="640" y="254" width="240" height="119" rx="5" fill="#dce9ee"/><text x="118" y="303" font-size="20" fill="#173c4b" font-weight="600">01  NOTICE</text><text x="398" y="303" font-size="20" fill="#173c4b" font-weight="600">02  STABILISE</text><text x="678" y="303" font-size="20" fill="#173c4b" font-weight="600">03  DECIDE</text><text x="105" y="344" font-size="17" fill="#173c4b" font-weight="600">Alarm or change</text><text x="385" y="344" font-size="17" fill="#173c4b" font-weight="600">Crew and sea room</text><text x="665" y="344" font-size="17" fill="#173c4b" font-weight="600">Return or call</text><text x="94" y="427" font-size="17" fill="#173c4b" font-weight="600">Use the actual vessel manual; seek help early when safety is threatened.</text><path d="M38 493H922" fill="none" stroke="#cadee2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="518" font-size="13" fill="#496b78" font-weight="700">SCHEMATIC • CHECK YOUR OWN BOAT MANUAL</text></svg>