<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300"><rect width="1000" height="1300" fill="white"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#122b46}.t{font-size:18px}.sm{font-size:15px}.h{font-size:25px;font-weight:bold}</style><text x="50" y="65" class="h">STARTING CIRCUIT</text><text x="50" y="100" class="t">How the start command controls the cranking current</text><text x="50" y="135" class="sm">Simplified 12 V, negative-return example • Shown at rest</text><rect x="50" y="210" width="180" height="100" rx="9" fill="#f2f6f8" stroke="#9aabb7"/><text x="65" y="240" class="t">START BATTERY</text><text x="65" y="266" class="sm">Positive (+) / negative (−)</text><text x="245" y="193" class="sm">ISOLATOR ON</text><path d="M230 240 H295" fill="none" stroke="#bd3c37" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M295 240 L350 240" fill="none" stroke="#bd3c37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 240 H580" fill="none" stroke="#bd3c37" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="435" cy="240" r="6" fill="#bd3c37"/><rect x="580" y="190" width="340" height="300" rx="12" fill="#f2f6f8" stroke="#9aabb7"/><text x="600" y="180" class="t">STARTER SOLENOID</text><text x="600" y="257" class="t">B+</text><text x="866" y="257" class="t">M</text><path d="M580 240 H655 M655 240 L725 210 M745 240 H920" fill="none" stroke="#bd3c37" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="645" y="290" class="sm">Heavy contacts: open at rest</text><rect x="790" y="550" width="150" height="90" rx="9" fill="#f2f6f8" stroke="#9aabb7"/><text x="805" y="580" class="t">STARTER</text><text x="805" y="606" class="sm">Motor</text><path d="M920 240 H960 V595 H940" fill="none" stroke="#bd3c37" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M790 595 H725 V700 H30 V310 H160" fill="none" stroke="#122b46" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="729" class="sm">Heavy negative return via engine block / approved return connection</text><path d="M435 240 V350 H100 V405" fill="none" stroke="#087c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="405" width="180" height="75" rx="9" fill="#f2f6f8" stroke="#9aabb7"/><text x="65" y="435" class="t">CONTROL FUSE</text><text x="65" y="461" class="sm">At supply take-off*</text><path d="M140 480 V515" fill="none" stroke="#087c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="515" width="180" height="75" rx="9" fill="#f2f6f8" stroke="#9aabb7"/><text x="65" y="545" class="t">START SWITCH</text><text x="65" y="571" class="sm">Momentary command</text><path d="M140 590 V625" fill="none" stroke="#087c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="625" width="180" height="65" rx="9" fill="#f2f6f8" stroke="#9aabb7"/><text x="65" y="655" class="t">NEUTRAL SWITCH</text><text x="65" y="681" class="sm">Closed in neutral*</text><path d="M520 685 V715" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 690 V780 H520 V410 H600" fill="none" stroke="#087c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="390" class="sm">S</text><rect x="600" y="380" width="150" height="55" fill="white" stroke="#087c89" stroke-width="3"/><text x="615" y="414" class="sm">Coil / actuator</text><path d="M750 410 H770 V700" fill="none" stroke="#122b46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="770" cy="700" r="5" fill="#122b46"/><path d="M725 700 H770" fill="none" stroke="#122b46" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M675 380 V315" stroke="#7a8791" stroke-width="2" stroke-dasharray="5 5"/><text x="50" y="845" class="h">READ THE TWO PATHS</text><path d="M50 875 H100" fill="none" stroke="#bd3c37" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="881" class="t">Main positive: battery → isolator → solenoid contacts → motor</text><path d="M50 915 H100" fill="none" stroke="#087c89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="921" class="t">Control: fused supply → start switch → neutral switch → coil</text><path d="M50 955 H100" fill="none" stroke="#122b46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="961" class="t">Negative return completes both circuits back to the battery</text><text x="50" y="1015" class="h">WHAT HAPPENS WHEN YOU PRESS START</text><text x="50" y="1050" class="t">1  The control circuit energises the solenoid.</text><text x="50" y="1080" class="t">2  The solenoid engages the pinion and closes the heavy contacts.</text><text x="50" y="1110" class="t">3  Battery current runs the starter; release START when the engine fires.</text><text x="50" y="1160" class="sm">* Concept diagram, not an installation plan. Some engines add a start relay or ECU.</text><text x="50" y="1184" class="sm">Neutral interlocks, return arrangements and circuit protection vary by installation.</text><text x="50" y="1208" class="sm">Main cable protection and cable sizes are intentionally unspecified: use the OEM diagram.</text><text x="50" y="1232" class="sm">Never bridge starter terminals or bypass an interlock. Charging circuits omitted for clarity.</text><text x="50" y="1270" class="sm">HELMLORE  •  ENGINE SYSTEMS  /  </text></svg>