<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Two circuits. Heat transfer, not mixing.</title><desc id="desc">Typical heat-exchanger cooling with a wet exhaust. Follow the actual installation diagram.</desc><defs><linearGradient id="metal"><stop stop-color="#6c8588"/><stop offset=".4" stop-color="#e2e9e6"/><stop offset=".65" stop-color="#b7c7c7"/><stop offset="1" stop-color="#516c73"/></linearGradient><linearGradient id="brass"><stop stop-color="#73521d"/><stop offset=".42" stop-color="#e5c478"/><stop offset="1" stop-color="#8c6931"/></linearGradient><linearGradient id="oil"><stop stop-color="#edd698"/><stop offset="1" stop-color="#b78135"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1440" height="900" fill="#f5f2e9"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="52" font-size="17" fill="#5c7778" font-weight="700" text-anchor="start">PROJECT WATCH / DIESEL ENGINE BASICS</text><text x="60" y="109" font-size="38" fill="#173a44" font-weight="700" text-anchor="start">Two circuits. Heat transfer, not mixing.</text><text x="60" y="152" font-size="23" fill="#526c70" font-weight="400" text-anchor="start">Typical heat-exchanger cooling with a wet exhaust. Follow the actual installation diagram.</text><rect x="60" y="211" width="1320" height="249" rx="16" fill="#f6e7d4" stroke="#ddc29c" stroke-width="2"/><rect x="60" y="499" width="1320" height="271" rx="16" fill="#dcecf0" stroke="#a3c4ce" stroke-width="2"/><text x="88" y="254" font-size="24" fill="#9a6630" font-weight="700" text-anchor="start">CLOSED COOLANT CIRCUIT</text><text x="88" y="540" font-size="24" fill="#287b99" font-weight="700" text-anchor="start">OPEN RAW-WATER CIRCUIT</text><rect x="90" y="284" width="275" height="87" rx="9" fill="#fff" stroke="#cfb894" stroke-width="2"/><text x="227" y="318" font-size="21" fill="#76501f" font-weight="700" text-anchor="middle">CIRCULATION PUMP</text><text x="227" y="348" font-size="20" fill="#526c70" font-weight="400" text-anchor="middle">Moves coolant</text><path d="M369 327L405 327" fill="none" stroke="#b88240" stroke-width="4" marker-end="url(#arrow)"/><rect x="410" y="284" width="275" height="87" rx="9" fill="#fff" stroke="#cfb894" stroke-width="2"/><text x="547" y="318" font-size="21" fill="#76501f" font-weight="700" text-anchor="middle">ENGINE</text><text x="547" y="348" font-size="20" fill="#526c70" font-weight="400" text-anchor="middle">Heat picked up</text><path d="M689 327L725 327" fill="none" stroke="#b88240" stroke-width="4" marker-end="url(#arrow)"/><rect x="730" y="284" width="275" height="87" rx="9" fill="#fff" stroke="#cfb894" stroke-width="2"/><text x="867" y="318" font-size="21" fill="#76501f" font-weight="700" text-anchor="middle">THERMOSTAT</text><text x="867" y="348" font-size="20" fill="#526c70" font-weight="400" text-anchor="middle">Controls flow</text><path d="M1009 327L1045 327" fill="none" stroke="#b88240" stroke-width="4" marker-end="url(#arrow)"/><rect x="1050" y="284" width="275" height="87" rx="9" fill="#fff" stroke="#cfb894" stroke-width="2"/><text x="1187" y="318" font-size="21" fill="#76501f" font-weight="700" text-anchor="middle">HEAT EXCHANGER</text><text x="1187" y="348" font-size="20" fill="#526c70" font-weight="400" text-anchor="middle">Heat transferred</text><path d="M1187 375V416H226V375" fill="none" stroke="#b88240" stroke-width="5" marker-end="url(#arrow)"/><text x="690" y="408" font-size="20" fill="#76501f" font-weight="400" text-anchor="middle">Cooled coolant returns</text><rect x="86" y="582" width="229" height="106" rx="9" fill="#fff" stroke="#a3c4ce" stroke-width="2"/><text x="200" y="620" font-size="20" fill="#285774" font-weight="700" text-anchor="middle">SEACOCK</text><text x="200" y="655" font-size="19" fill="#526c70" font-weight="400" text-anchor="middle">Hull inlet</text><path d="M317 634L343 634" fill="none" stroke="#287b99" stroke-width="3" marker-end="url(#arrow)"/><rect x="347" y="582" width="229" height="106" rx="9" fill="#fff" stroke="#a3c4ce" stroke-width="2"/><text x="461" y="620" font-size="20" fill="#285774" font-weight="700" text-anchor="middle">STRAINER</text><text x="461" y="655" font-size="19" fill="#526c70" font-weight="400" text-anchor="middle">Catches debris</text><path d="M578 634L604 634" fill="none" stroke="#287b99" stroke-width="3" marker-end="url(#arrow)"/><rect x="608" y="582" width="229" height="106" rx="9" fill="#fff" stroke="#a3c4ce" stroke-width="2"/><text x="722" y="620" font-size="20" fill="#285774" font-weight="700" text-anchor="middle">RAW-WATER PUMP</text><text x="722" y="655" font-size="19" fill="#526c70" font-weight="400" text-anchor="middle">Flexible impeller</text><path d="M839 634L865 634" fill="none" stroke="#287b99" stroke-width="3" marker-end="url(#arrow)"/><rect x="869" y="582" width="229" height="106" rx="9" fill="#fff" stroke="#a3c4ce" stroke-width="2"/><text x="983" y="620" font-size="20" fill="#285774" font-weight="700" text-anchor="middle">HEAT EXCHANGER</text><text x="983" y="655" font-size="19" fill="#526c70" font-weight="400" text-anchor="middle">Receives heat</text><path d="M1100 634L1126 634" fill="none" stroke="#287b99" stroke-width="3" marker-end="url(#arrow)"/><rect x="1130" y="582" width="229" height="106" rx="9" fill="#fff" stroke="#a3c4ce" stroke-width="2"/><text x="1244" y="620" font-size="20" fill="#285774" font-weight="700" text-anchor="middle">WET EXHAUST</text><text x="1244" y="655" font-size="19" fill="#526c70" font-weight="400" text-anchor="middle">Water leaves boat</text><text x="895" y="487" font-size="19" fill="#76501f" font-weight="400" text-anchor="start">Same exchanger: heat transfer only</text><text x="90" y="737" font-size="22" fill="#526c70" font-weight="400" text-anchor="start">Warm-up bypass, extra coolers and anti-siphon arrangements are not drawn.</text><text x="60" y="858" font-size="19" fill="#526c70" font-weight="400" text-anchor="start">Original principle diagram • actual layout and servicing depend on the model</text></g></svg>