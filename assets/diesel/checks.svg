<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">A simple before-start routine</title><desc id="desc">Afloat, with the engine stopped and cool. Follow your boat’s manual.</desc><defs><linearGradient id="metal"><stop stop-color="#6c8588"/><stop offset=".4" stop-color="#e2e9e6"/><stop offset=".65" stop-color="#b7c7c7"/><stop offset="1" stop-color="#516c73"/></linearGradient><linearGradient id="brass"><stop stop-color="#73521d"/><stop offset=".42" stop-color="#e5c478"/><stop offset="1" stop-color="#8c6931"/></linearGradient><linearGradient id="oil"><stop stop-color="#edd698"/><stop offset="1" stop-color="#b78135"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1440" height="900" fill="#f5f2e9"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="52" font-size="17" fill="#5c7778" font-weight="700" text-anchor="start">PROJECT WATCH / DIESEL ENGINE BASICS</text><text x="60" y="109" font-size="38" fill="#173a44" font-weight="700" text-anchor="start">A simple before-start routine</text><text x="60" y="152" font-size="23" fill="#526c70" font-weight="400" text-anchor="start">Afloat, with the engine stopped and cool. Follow your boat’s manual.</text><rect x="65" y="219" width="630" height="246" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><text x="95" y="272" font-size="28" fill="#173a44" font-weight="700" text-anchor="start">FLUIDS</text><text x="95" y="339" font-size="24" fill="#173a44" font-weight="400" text-anchor="start">Oil • coolant • gearbox fluid</text><text x="95" y="396" font-size="22" fill="#526c70" font-weight="400" text-anchor="start">Correct method, within specified levels</text><rect x="745" y="219" width="630" height="246" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><text x="775" y="272" font-size="28" fill="#173a44" font-weight="700" text-anchor="start">SUPPLIES</text><text x="775" y="339" font-size="24" fill="#173a44" font-weight="400" text-anchor="start">Fuel • starting battery • cooling inlet</text><text x="775" y="396" font-size="22" fill="#526c70" font-weight="400" text-anchor="start">Available, correctly set and inspected</text><rect x="65" y="505" width="630" height="246" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><text x="95" y="558" font-size="28" fill="#173a44" font-weight="700" text-anchor="start">CONDITION</text><text x="95" y="625" font-size="24" fill="#173a44" font-weight="400" text-anchor="start">Leaks • hoses • belt • strainer</text><text x="95" y="682" font-size="22" fill="#526c70" font-weight="400" text-anchor="start">Inspect safely; resolve new problems</text><rect x="745" y="505" width="630" height="246" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><text x="775" y="558" font-size="28" fill="#173a44" font-weight="700" text-anchor="start">AFTER START</text><text x="775" y="625" font-size="24" fill="#173a44" font-weight="400" text-anchor="start">Cooling discharge • instruments</text><text x="775" y="682" font-size="22" fill="#526c70" font-weight="400" text-anchor="start">Keep clear; confirm normal operation</text><text x="60" y="858" font-size="19" fill="#526c70" font-weight="400" text-anchor="start">Original principle diagram • actual layout and servicing depend on the model</text></g></svg>