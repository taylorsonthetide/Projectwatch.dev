<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Six systems. One reliable engine.</title><desc id="desc">Learn the jobs first, then locate the actual parts in your manual.</desc><defs><linearGradient id="metal"><stop stop-color="#6c8588"/><stop offset=".4" stop-color="#e2e9e6"/><stop offset=".65" stop-color="#b7c7c7"/><stop offset="1" stop-color="#516c73"/></linearGradient><linearGradient id="brass"><stop stop-color="#73521d"/><stop offset=".42" stop-color="#e5c478"/><stop offset="1" stop-color="#8c6931"/></linearGradient><linearGradient id="oil"><stop stop-color="#edd698"/><stop offset="1" stop-color="#b78135"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1440" height="900" fill="#f5f2e9"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="52" font-size="17" fill="#5c7778" font-weight="700" text-anchor="start">PROJECT WATCH / DIESEL ENGINE BASICS</text><text x="60" y="109" font-size="38" fill="#173a44" font-weight="700" text-anchor="start">Six systems. One reliable engine.</text><text x="60" y="152" font-size="23" fill="#526c70" font-weight="400" text-anchor="start">Learn the jobs first, then locate the actual parts in your manual.</text><rect x="60" y="218" width="420" height="235" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><circle cx="112" cy="271" r="25" fill="#bd852e"/><text x="112" y="279" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="155" y="280" font-size="27" fill="#173a44" font-weight="700" text-anchor="start">FUEL</text><text x="88" y="346" font-size="22" fill="#173a44" font-weight="400" text-anchor="start">Clean diesel, delivered correctly</text><text x="88" y="396" font-size="20" fill="#526c70" font-weight="400" text-anchor="start">Tank → filters → injection</text><rect x="510" y="218" width="420" height="235" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><circle cx="562" cy="271" r="25" fill="#597e67"/><text x="562" y="279" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="605" y="280" font-size="27" fill="#173a44" font-weight="700" text-anchor="start">AIR</text><text x="538" y="346" font-size="22" fill="#173a44" font-weight="400" text-anchor="start">Air in; exhaust out</text><text x="538" y="396" font-size="20" fill="#526c70" font-weight="400" text-anchor="start">Ventilation and sound exhaust</text><rect x="960" y="218" width="420" height="235" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><circle cx="1012" cy="271" r="25" fill="#287b99"/><text x="1012" y="279" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="1055" y="280" font-size="27" fill="#173a44" font-weight="700" text-anchor="start">COOLING</text><text x="988" y="346" font-size="22" fill="#173a44" font-weight="400" text-anchor="start">Heat out of the engine</text><text x="988" y="396" font-size="20" fill="#526c70" font-weight="400" text-anchor="start">Coolant + seawater circuits</text><rect x="60" y="498" width="420" height="235" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><circle cx="112" cy="551" r="25" fill="#a4773a"/><text x="112" y="559" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="155" y="560" font-size="27" fill="#173a44" font-weight="700" text-anchor="start">LUBRICATION</text><text x="88" y="626" font-size="22" fill="#173a44" font-weight="400" text-anchor="start">Protect moving parts</text><text x="88" y="676" font-size="20" fill="#526c70" font-weight="400" text-anchor="start">Specified oil, level and pressure</text><rect x="510" y="498" width="420" height="235" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><circle cx="562" cy="551" r="25" fill="#526b9b"/><text x="562" y="559" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="605" y="560" font-size="27" fill="#173a44" font-weight="700" text-anchor="start">STARTING</text><text x="538" y="626" font-size="22" fill="#173a44" font-weight="400" text-anchor="start">Turn the engine to start</text><text x="538" y="676" font-size="20" fill="#526c70" font-weight="400" text-anchor="start">Battery, cables and starter</text><rect x="960" y="498" width="420" height="235" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><circle cx="1012" cy="551" r="25" fill="#6b7178"/><text x="1012" y="559" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="1055" y="560" font-size="27" fill="#173a44" font-weight="700" text-anchor="start">DRIVE</text><text x="988" y="626" font-size="22" fill="#173a44" font-weight="400" text-anchor="start">Power to the propeller</text><text x="988" y="676" font-size="20" fill="#526c70" font-weight="400" text-anchor="start">Gearbox and shaft / saildrive</text><text x="60" y="858" font-size="19" fill="#526c70" font-weight="400" text-anchor="start">Original principle diagram • actual layout and servicing depend on the model</text></g></svg>