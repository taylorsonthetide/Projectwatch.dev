<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Interpret smoke with the whole picture</title><desc id="desc">These are possibilities to investigate, not diagnoses.</desc><defs><linearGradient id="metal"><stop stop-color="#6c8588"/><stop offset=".4" stop-color="#e2e9e6"/><stop offset=".65" stop-color="#b7c7c7"/><stop offset="1" stop-color="#516c73"/></linearGradient><linearGradient id="brass"><stop stop-color="#73521d"/><stop offset=".42" stop-color="#e5c478"/><stop offset="1" stop-color="#8c6931"/></linearGradient><linearGradient id="oil"><stop stop-color="#edd698"/><stop offset="1" stop-color="#b78135"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1440" height="900" fill="#f5f2e9"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="52" font-size="17" fill="#5c7778" font-weight="700" text-anchor="start">HELMLORE / DIESEL ENGINE BASICS</text><text x="60" y="109" font-size="38" fill="#173a44" font-weight="700" text-anchor="start">Interpret smoke with the whole picture</text><text x="60" y="152" font-size="23" fill="#526c70" font-weight="400" text-anchor="start">These are possibilities to investigate, not diagnoses.</text><rect x="65" y="219" width="630" height="246" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><text x="95" y="272" font-size="28" fill="#173a44" font-weight="700" text-anchor="start">BLACK</text><text x="95" y="339" font-size="24" fill="#173a44" font-weight="400" text-anchor="start">Excess load / insufficient air possible</text><text x="95" y="396" font-size="22" fill="#526c70" font-weight="400" text-anchor="start">Consider load, air supply and performance</text><rect x="745" y="219" width="630" height="246" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><text x="775" y="272" font-size="28" fill="#173a44" font-weight="700" text-anchor="start">BLUE</text><text x="775" y="339" font-size="24" fill="#173a44" font-weight="400" text-anchor="start">Oil burning possible</text><text x="775" y="396" font-size="22" fill="#526c70" font-weight="400" text-anchor="start">Check consumption and seek investigation</text><rect x="65" y="505" width="630" height="246" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><text x="95" y="558" font-size="28" fill="#173a44" font-weight="700" text-anchor="start">WHITE</text><text x="95" y="625" font-size="24" fill="#173a44" font-weight="400" text-anchor="start">Unburned fuel / other fault possible</text><text x="95" y="682" font-size="22" fill="#526c70" font-weight="400" text-anchor="start">Cold-start behaviour changes the picture</text><rect x="745" y="505" width="630" height="246" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><text x="775" y="558" font-size="28" fill="#173a44" font-weight="700" text-anchor="start">STEAM + HEAT</text><text x="775" y="625" font-size="24" fill="#173a44" font-weight="400" text-anchor="start">Reduced raw-water cooling possible</text><text x="775" y="682" font-size="22" fill="#526c70" font-weight="400" text-anchor="start">Check discharge and respond promptly</text><text x="60" y="858" font-size="19" fill="#526c70" font-weight="400" text-anchor="start">Original principle diagram • actual layout and servicing depend on the model</text></g></svg>