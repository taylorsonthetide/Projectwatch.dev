<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Level is not the same as pressure.</title><desc id="desc">Engine oil and gearbox fluid have their own specifications and checking procedures.</desc><defs><linearGradient id="metal"><stop stop-color="#6c8588"/><stop offset=".4" stop-color="#e2e9e6"/><stop offset=".65" stop-color="#b7c7c7"/><stop offset="1" stop-color="#516c73"/></linearGradient><linearGradient id="brass"><stop stop-color="#73521d"/><stop offset=".42" stop-color="#e5c478"/><stop offset="1" stop-color="#8c6931"/></linearGradient><linearGradient id="oil"><stop stop-color="#edd698"/><stop offset="1" stop-color="#b78135"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1440" height="900" fill="#f5f2e9"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="52" font-size="17" fill="#5c7778" font-weight="700" text-anchor="start">PROJECT WATCH / DIESEL ENGINE BASICS</text><text x="60" y="109" font-size="38" fill="#173a44" font-weight="700" text-anchor="start">Level is not the same as pressure.</text><text x="60" y="152" font-size="23" fill="#526c70" font-weight="400" text-anchor="start">Engine oil and gearbox fluid have their own specifications and checking procedures.</text><rect x="70" y="223" width="665" height="565" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><rect x="779" y="223" width="591" height="565" rx="16" fill="#fff" stroke="#c4cec7" stroke-width="2"/><text x="105" y="270" font-size="25" fill="#173a44" font-weight="700" text-anchor="start">CHECK LEVEL BY THE MANUAL</text><text x="105" y="304" font-size="20" fill="#526c70" font-weight="400" text-anchor="start">Engine stopped; specified wait and boat attitude</text><path d="M375 335V688" stroke="url(#metal)" stroke-width="36"/><path d="M347 492H404M347 613H404" stroke="#173a44" stroke-width="5"/><text x="438" y="500" font-size="24" fill="#173a44" font-weight="700" text-anchor="start">MAX</text><text x="438" y="620" font-size="24" fill="#173a44" font-weight="700" text-anchor="start">MIN</text><path d="M358 532V613" stroke="#b88240" stroke-width="25"/><text x="105" y="745" font-size="23" fill="#173a44" font-weight="400" text-anchor="start">Within the marks — never deliberately overfill</text><text x="812" y="270" font-size="25" fill="#173a44" font-weight="700" text-anchor="start">LUBRICATION PATH</text><text x="812" y="304" font-size="20" fill="#526c70" font-weight="400" text-anchor="start">Simplified principle; arrangements vary</text><rect x="834" y="322" width="480" height="68" rx="9" fill="#fff" stroke="#c5b598" stroke-width="2"/><text x="1074" y="365" font-size="23" fill="#805f2b" font-weight="700" text-anchor="middle">SUMP / PICKUP</text><path d="M1074 392L1074 414" fill="none" stroke="#b88240" stroke-width="3" marker-end="url(#arrow)"/><rect x="834" y="421" width="480" height="68" rx="9" fill="#fff" stroke="#c5b598" stroke-width="2"/><text x="1074" y="464" font-size="23" fill="#805f2b" font-weight="700" text-anchor="middle">OIL PUMP</text><path d="M1074 491L1074 513" fill="none" stroke="#b88240" stroke-width="3" marker-end="url(#arrow)"/><rect x="834" y="520" width="480" height="68" rx="9" fill="#fff" stroke="#c5b598" stroke-width="2"/><text x="1074" y="563" font-size="23" fill="#805f2b" font-weight="700" text-anchor="middle">OIL FILTER</text><path d="M1074 590L1074 612" fill="none" stroke="#b88240" stroke-width="3" marker-end="url(#arrow)"/><rect x="834" y="619" width="480" height="68" rx="9" fill="#fff" stroke="#c5b598" stroke-width="2"/><text x="1074" y="662" font-size="23" fill="#805f2b" font-weight="700" text-anchor="middle">BEARINGS / MOVING PARTS</text><text x="814" y="755" font-size="23" fill="#173a44" font-weight="400" text-anchor="start">Oil drains back to the sump</text><text x="60" y="858" font-size="19" fill="#526c70" font-weight="400" text-anchor="start">Original principle diagram • actual layout and servicing depend on the model</text></g></svg>