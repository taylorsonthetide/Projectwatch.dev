<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEVNI Latest Graphics Approval Batch 06</title><style>
body{margin:0;background:#07151c;color:#eef9fc;font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b2632;padding:16px;border-bottom:1px solid #28505e}h1{font-size:22px;margin:0}.sub{color:#b8d5de;margin:5px 0 10px}.bar{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:9px 11px;font-weight:800}.bar button{background:#183b48;color:#fff}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;padding:16px}.card{background:#0e222b;border:2px solid #244854;border-radius:14px;overflow:hidden}.card[data-status=approved]{border-color:#4ac78a}.card[data-status=rejected]{border-color:#e96c6c}.card[data-status=hold]{border-color:#e8bd59}.art{height:285px;background:#fff}.art svg{width:100%;height:100%}.body{padding:13px}.code{font-size:23px;color:#79e0ff;font-weight:900}h3{font-size:16px;margin:4px 0 7px}p,small{color:#b8d5de}.buttons{display:flex;gap:6px;margin-top:11px}.approve{background:#4ac78a}.reject{background:#e96c6c}.hold{background:#e8bd59}textarea{box-sizing:border-box;width:100%;min-height:50px;margin-top:9px;background:#07151c;color:#fff;border:1px solid #315b68;border-radius:8px;padding:8px}.hidden{display:none}#results{display:none;margin:16px;background:#fff;color:#111;padding:12px;border-radius:10px;white-space:pre-wrap}</style></head><body>
<header><h1>PROJECT WATCH · CEVNI LATEST GRAPHICS · APPROVAL BATCH 06</h1><div class="sub">Fairway limits · Rev.6 Annex 8 figs.1–2 · 8 clean reconstructions · legacy v5 excluded · 1.63.33 untouched</div><div class="bar"><button onclick="filter('all')">ALL 8</button><button onclick="filter('unreviewed')">UNREVIEWED</button><button onclick="filter('approved')">APPROVED</button><button onclick="filter('rejected')">REJECTED</button><button onclick="filter('hold')">HOLD</button><button onclick="showResults()">SHOW / COPY RESULTS</button></div></header><main id="cards"></main><pre id="results"></pre><script>
const items=[['1.A','Right-hand buoy — with light','red','buoyLight'],['1.B','Right-hand buoy — without light','red','buoy'],['1.C','Right-hand float — with topmark','red','float'],['1.D','Right-hand spar','red','spar'],['2.A','Left-hand buoy — with light','green','buoyLight'],['2.B','Left-hand buoy — without light','green','buoy'],['2.C','Left-hand float — with topmark','green','float'],['2.D','Left-hand spar','green','spar']];
const KEY='pwCevniLatestGraphicsBatch06';let db=JSON.parse(localStorage.getItem(KEY)||'{}');
function top(col,x=160,y=68){let c=col==='red'?'#e30613':'#008c4a';return col==='red'?'<rect x="'+(x-24)+'" y="'+(y-19)+'" width="48" height="38" fill="'+c+'" stroke="#111" stroke-width="3"/>':'<polygon points="'+x+','+(y-28)+' '+(x-30)+','+(y+20)+' '+(x+30)+','+(y+20)+'" fill="'+c+'" stroke="#111" stroke-width="3"/>'}
function light(col){let c=col==='red'?'#e30613':'#00a65a';return '<circle cx="160" cy="38" r="11" fill="'+c+'" stroke="#111" stroke-width="3"/><path d="M160 15v10M138 21l8 8M182 21l-8 8M132 38h14M174 38h14" stroke="'+c+'" stroke-width="3"/>'}
function svg(col,t){let c=col==='red'?'#e30613':'#008c4a',water='<path d="M75 248h170M95 260h55m25 0h50" stroke="#387ba0" stroke-width="3"/>';let shape='';
if(t==='buoy'||t==='buoyLight'){shape=col==='red'?'<path d="M122 116h76v105q-38 30-76 0z" fill="'+c+'" stroke="#111" stroke-width="3"/>':'<path d="M160 105l52 116q-52 30-104 0z" fill="'+c+'" stroke="#111" stroke-width="3"/>';return '<svg viewBox="0 0 320 285">'+(t==='buoyLight'?light(col):'')+(t==='buoyLight'?'<path d="M160 49v50" stroke="#333" stroke-width="4"/>':'')+shape+water+'</svg>'}
if(t==='float')return '<svg viewBox="0 0 320 285">'+top(col)+'<path d="M160 88v48" stroke="#333" stroke-width="4"/><path d="M115 158q45-28 90 0l-12 70q-33 18-66 0z" fill="'+c+'" stroke="#111" stroke-width="3"/>'+water+'</svg>';
return '<svg viewBox="0 0 320 285">'+top(col)+'<path d="M145 95h30v140h-30z" fill="'+c+'" stroke="#111" stroke-width="3"/>'+water+'</svg>'}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){cards.innerHTML=items.map(x=>{let id='PW-CEVNI-ANNEX8-'+x[0].replace('.','-'),r=db[id]||{status:'unreviewed',note:''};let desc=x[2]==='red'?'Red; cylindrical buoy/buoy with topmark/spar; red cylinder topmark; rhythmic red light when fitted':'Green; conical buoy/buoy with topmark/spar; green cone point upwards; rhythmic green light when fitted';return '<article class="card" data-id="'+id+'" data-status="'+r.status+'"><div class="art">'+svg(x[2],x[3])+'</div><div class="body"><div class="code">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+desc+'</p><small>'+id+' · CLEAN REV.6 RECONSTRUCTION · HUMAN APPROVAL REQUIRED</small><div class="buttons"><button class="approve" onclick="setState(this,\'approved\')">✓ APPROVE</button><button class="reject" onclick="setState(this,\'rejected\')">✕ REJECT</button><button class="hold" onclick="setState(this,\'hold\')">? HOLD</button></div><textarea placeholder="Optional note" oninput="saveNote(this)">'+esc(r.note)+'</textarea></div></article>'}).join('')}
function setState(b,s){let c=b.closest('.card'),id=c.dataset.id;c.dataset.status=s;db[id]={status:s,note:c.querySelector('textarea').value};localStorage.setItem(KEY,JSON.stringify(db))}
function saveNote(t){let c=t.closest('.card'),id=c.dataset.id;db[id]=db[id]||{status:c.dataset.status};db[id].note=t.value;localStorage.setItem(KEY,JSON.stringify(db))}
function filter(s){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',s!=='all'&&c.dataset.status!==s))}
async function showResults(){let out={version:'latest-graphics-batch-06',authority:'CEVNI Rev.6 Annex 8 figs.1-2; Corr.1/Corr.2 and Amendments 1/2 checked before promotion',old_v5_artwork:'EXCLUDED',review:db},txt=JSON.stringify(out,null,2),p=document.getElementById('results');p.textContent=txt;p.style.display='block';p.scrollIntoView({behavior:'smooth'});try{await navigator.clipboard.writeText(txt);alert('Results copied. Paste them back into ChatGPT.')}catch(e){alert('Results shown below. Select and copy them into ChatGPT.')}}
render();</script></body></html>
